<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>專業計分遙控器</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

    :root { 
      --red: #ff3333; --green: #33ff33; --blue: #00d2ff; --bg: #000; 
      --btn-gray: #1a1a1a;
      --font-score: 22vw;
    }
    
    body { 
      font-family: 'Orbitron', sans-serif; 
      background-color: #000; color: white; 
      margin: 0; padding: 0;
      display: flex; flex-direction: column; 
      height: 100vh; width: 100vw;
      overflow: hidden; 
    }
    
    .container { 
      display: flex; flex-direction: column; 
      height: 100%; width: 100%;
      padding: 10px; box-sizing: border-box;
    }

    .main-layout { display: flex; gap: 10px; flex: 1; min-height: 0; }
    .team-column { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }

    /* 七段顯示器視窗 */
    .score-box { 
      background: var(--bg); border: 3px solid #333; border-radius: 15px; 
      flex: 2.5; display: flex; flex-direction: column; justify-content: center; align-items: center; 
      position: relative; cursor: pointer;
    }
    
    .team-label { 
      font-size: 5vw; 
      color: var(--blue); 
      margin-bottom: 5px; 
      font-weight: 900; 
      width: 90%;
      text-align: center;
      border-bottom: 1px solid rgba(0, 210, 255, 0.3);
    }

    .score-val { font-size: var(--font-score); line-height: 0.9; }

    /* 發球與勝利 */
    .score-box.serving { border: 4px solid #fff; }
    .score-box.serving::before { 
      content: "SERVING"; position: absolute; top: 0; background: white; color: black; 
      font-size: 1.5vh; padding: 1px 8px; font-weight: bold; 
    }
    .winner { border-color: gold !important; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    .winner .score-val { animation: blink 0.6s infinite; }

    /* 按鈕列：高度適中 */
    .btn-row { display: flex; gap: 8px; flex: 0.8; }
    button { 
      flex: 1; border: none; border-radius: 10px; 
      font-weight: bold; font-size: 4vh; cursor: pointer; 
      touch-action: manipulation;
    }
    .btn-minus { font-size: 2.5vh !important; background: var(--btn-gray) !important; color: inherit; border: 1px solid currentColor !important; }

    .team-a { color: var(--red); }
    .team-a .btn-plus { background: var(--red); color: white; }
    .team-b { color: var(--green); }
    .team-b .btn-plus { background: var(--green); color: black; }

    /* RESET：僅文字大，按鈕高度正常 */
    .btn-reset { 
      height: 8vh; /* 縮減回正常高度 */
      width: 100%; 
      background: transparent; 
      border: 2px solid var(--blue); 
      color: var(--blue); 
      font-size: 4vh; /* 文字依然保持巨大 */
      font-weight: 900;
      border-radius: 12px; 
      margin-top: 10px; 
      flex-shrink: 0; 
    }

    /* 橫向模式適配 */
    @media (orientation: landscape) {
      :root { --font-score: 35vh; }
      .team-label { font-size: 5vh; }
      .btn-reset { height: 10vh; font-size: 5vh; margin-top: 5px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-layout">
      <div class="team-column team-a">
        <div id="panel-A" class="score-box serving" onclick="setSrv('A')">
          <div class="team-label">TEAM A</div>
          <div id="score-A" class="score-val">00</div>
        </div>
        <div class="btn-row">
          <button id="btn-A-plus" class="btn-plus" onclick="changeScore('A', 1)">+1</button>
          <button class="btn-minus" onclick="changeScore('A', -1)">-1</button>
        </div>
      </div>
      <div class="team-column team-b">
        <div id="panel-B" class="score-box" onclick="setSrv('B')">
          <div class="team-label">TEAM B</div>
          <div id="score-B" class="score-val">00</div>
        </div>
        <div class="btn-row">
          <button id="btn-B-plus" class="btn-plus" onclick="changeScore('B', 1)">+1</button>
          <button class="btn-minus" onclick="changeScore('B', -1)">-1</button>
        </div>
      </div>
    </div>
    <button class="btn-reset" onclick="resetGame()">RESET</button>
  </div>

  <script>
    let scoreA = 0, scoreB = 0, gameOver = false;
    function sendCmd(cmd) { if (navigator.vibrate) navigator.vibrate(35); fetch('/cmd?action=' + cmd); }
    function checkWinner() {
      let winner = null;
      if ((scoreA >= 21 && (scoreA - scoreB) >= 2) || scoreA === 30) winner = 'A';
      else if ((scoreB >= 21 && (scoreB - scoreA) >= 2) || scoreB === 30) winner = 'B';
      if (winner) {
        gameOver = true;
        document.getElementById('panel-' + winner).classList.add('winner');
        document.getElementById('btn-A-plus').disabled = true; document.getElementById('btn-B-plus').disabled = true;
      }
    }
    function changeScore(team, val) {
      if (gameOver && val > 0) return;
      if (team === 'A') { scoreA = Math.max(0, scoreA + val); document.getElementById('score-A').innerText = scoreA.toString().padStart(2, '0'); }
      else { scoreB = Math.max(0, scoreB + val); document.getElementById('score-B').innerText = scoreB.toString().padStart(2, '0'); }
      sendCmd(team + (val > 0 ? '_PLUS' : '_MINUS'));
      if (val < 0) {
        gameOver = false;
        document.querySelectorAll('.score-box').forEach(el => el.classList.remove('winner'));
        document.getElementById('btn-A-plus').disabled = false; document.getElementById('btn-B-plus').disabled = false;
      }
      checkWinner();
    }
    function setSrv(team) {
      document.getElementById('panel-A').classList.toggle('serving', team === 'A');
      document.getElementById('panel-B').classList.toggle('serving', team === 'B');
      sendCmd(team + '_SRV');
    }
    function resetGame() {
      if(confirm('Reset Match?')) {
        scoreA = 0; scoreB = 0; gameOver = false;
        document.getElementById('score-A').innerText = '00'; document.getElementById('score-B').innerText = '00';
        document.querySelectorAll('.score-box').forEach(el => el.classList.remove('winner'));
        document.getElementById('btn-A-plus').disabled = false; document.getElementById('btn-B-plus').disabled = false;
        setSrv('A'); sendCmd('RESET');
      }
    }
  </script>
</body>
</html>
