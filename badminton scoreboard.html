const char* htmlPage = R"rawliteral(
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>全自適應羽球計分板</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

    :root { 
      --red: #ff3333; --green: #33ff33; --bg: #000; 
      --btn-gray: #222;
      /* 定義響應式變數 */
      --font-score: 18vw; 
    }
    
    body { 
      font-family: 'Orbitron', sans-serif; 
      background-color: #111; color: white; 
      margin: 0; padding: 0;
      display: flex; flex-direction: column; 
      height: 100vh; width: 100vw;
      overflow: hidden; box-sizing: border-box;
    }
    
    .container { 
      display: flex; flex-direction: column; 
      height: 100%; width: 100%;
      padding: 2vh 2vw; box-sizing: border-box;
    }

    h2 { font-size: 2.5vh; color: #444; text-align: center; margin: 1vh 0; letter-spacing: 0.5vw; flex-shrink: 0; }

    /* 主佈局：左右對分，高度撐滿 */
    .main-layout { 
      display: flex; gap: 2vw; flex: 1; min-height: 0; 
    }
    
    .team-column { 
      flex: 1; display: flex; flex-direction: column; gap: 1.5vh; min-width: 0;
    }

    /* 七段顯示器視窗：高度隨螢幕縮放 */
    .score-box { 
      background: var(--bg); border: 0.5vh solid #222; border-radius: 2vh; 
      flex: 2; /* 佔據較多垂直空間 */
      display: flex; flex-direction: column; justify-content: center; align-items: center; 
      position: relative; cursor: pointer; transition: all 0.2s;
    }
    
    .score-val { font-size: var(--font-score); line-height: 1; }
    .team-label { font-size: 2vh; margin-bottom: 1vh; color: #555; font-family: sans-serif; font-weight: bold; }

    /* 發球方高亮：白色粗框 */
    .score-box.serving { border: 0.8vh solid #fff; transform: scale(0.98); }
    .score-box.serving::before { 
      content: "SERVING"; position: absolute; top: -1.5vh; background: white; color: black; 
      font-size: 1.5vh; padding: 0.2vh 1vw; font-weight: bold; border-radius: 0.5vh; font-family: sans-serif; 
    }

    /* 勝利動畫 */
    @keyframes winner-blink { 0%, 100% { background-color: #000; } 50% { background-color: #333; } }
    .winner { animation: winner-blink 0.6s infinite; border-color: gold !important; }
    .win-text { color: gold; font-size: 2vh; margin-top: 1vh; display: none; font-family: sans-serif; }
    .winner .win-text { display: block; }

    /* 按鈕列：寬度 100% 且與視窗對齊 */
    .btn-row { display: flex; gap: 1vw; flex: 1; }
    
    button { 
      flex: 1; border: none; border-radius: 1.5vh; 
      font-weight: bold; font-size: 4vh; cursor: pointer; 
      touch-action: manipulation; transition: 0.1s; font-family: sans-serif;
    }
    button:active { filter: brightness(1.5); transform: translateY(0.5vh); }
    button:disabled { opacity: 0.2; }
    
    .team-a .score-val { color: var(--red); }
    .team-a .btn-plus { background-color: var(--red); color: white; }
    .team-a .btn-minus { background-color: var(--btn-gray); color: var(--red); border: 2px solid var(--red); font-size: 2.5vh; }
    
    .team-b .score-val { color: var(--green); }
    .team-b .btn-plus { background-color: var(--green); color: black; }
    .team-b .btn-minus { background-color: var(--btn-gray); color: var(--green); border: 2px solid var(--green); font-size: 2.5vh; }
    
    .btn-reset { 
      height: 6vh; width: 100%; background: transparent; 
      border: 1px solid #333; color: #444; font-size: 1.8vh; 
      border-radius: 1vh; margin-top: 2vh; flex-shrink: 0;
    }

    /* 針對平板或橫向螢幕調整字體大小 */
    @media (min-width: 768px) { :root { --font-score: 12vw; } }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="status-text">BADMINTON SCOREBOARD</h2>
    
    <div class="main-layout">
      <div class="team-column team-a">
        <div id="panel-A" class="score-box serving" onclick="setSrv('A')">
          <div class="team-label">TEAM A</div>
          <div id="score-A" class="score-val">00</div>
          <div class="win-text">🏆 WINNER</div>
        </div>
        <div class="btn-row">
          <button id="btn-A-plus" class="btn-plus" onclick="changeScore('A', 1)">+1</button>
          <button class="btn-minus" onclick="changeScore('A', -1)">-1</button>
        </div>
      </div>

      <div class="team-column team-b">
        <div id="panel-B" class="score-box" onclick="setSrv('B')">
          <div class="team-label">TEAM B</div>
          <div id="score-B" class="score-val">00</div>
          <div class="win-text">🏆 WINNER</div>
        </div>
        <div class="btn-row">
          <button id="btn-B-plus" class="btn-plus" onclick="changeScore('B', 1)">+1</button>
          <button class="btn-minus" onclick="changeScore('B', -1)">-1</button>
        </div>
      </div>
    </div>

    <button class="btn-reset" onclick="resetGame()">RESET MATCH</button>
  </div>

  <script>
    let scoreA = 0, scoreB = 0, gameOver = false;

    function sendCmd(cmd) {
      if (navigator.vibrate) navigator.vibrate(30);
      fetch('/cmd?action=' + cmd);
    }

    function checkWinner() {
      let winner = null;
      if ((scoreA >= 21 && (scoreA - scoreB) >= 2) || scoreA === 30) winner = 'A';
      else if ((scoreB >= 21 && (scoreB - scoreA) >= 2) || scoreB === 30) winner = 'B';

      if (winner) {
        gameOver = true;
        document.getElementById('panel-' + winner).classList.add('winner');
        document.getElementById('btn-A-plus').disabled = true;
        document.getElementById('btn-B-plus').disabled = true;
        document.getElementById('status-text').innerText = 'TEAM ' + winner + ' WINS!';
        document.getElementById('status-text').style.color = 'gold';
      }
    }

    function changeScore(team, val) {
      if (gameOver && val > 0) return;
      if (team === 'A') {
        scoreA = Math.max(0, scoreA + val);
        document.getElementById('score-A').innerText = scoreA.toString().padStart(2, '0');
      } else {
        scoreB = Math.max(0, scoreB + val);
        document.getElementById('score-B').innerText = scoreB.toString().padStart(2, '0');
      }
      sendCmd(team + (val > 0 ? '_PLUS' : '_MINUS'));

      if (val < 0) {
        gameOver = false;
        document.querySelectorAll('.score-box').forEach(el => el.classList.remove('winner'));
        document.getElementById('btn-A-plus').disabled = false;
        document.getElementById('btn-B-plus').disabled = false;
        document.getElementById('status-text').innerText = 'BADMINTON SCOREBOARD';
        document.getElementById('status-text').style.color = '#444';
      }
      checkWinner();
    }

    function setSrv(team) {
      document.getElementById('panel-A').classList.toggle('serving', team === 'A');
      document.getElementById('panel-B').classList.toggle('serving', team === 'B');
      sendCmd(team + '_SRV');
    }

    function resetGame() {
      if(confirm('Reset?')) {
        scoreA = 0; scoreB = 0; gameOver = false;
        document.getElementById('score-A').innerText = '00';
        document.getElementById('score-B').innerText = '00';
        document.querySelectorAll('.score-box').forEach(el => el.classList.remove('winner'));
        document.getElementById('btn-A-plus').disabled = false;
        document.getElementById('btn-B-plus').disabled = false;
        setSrv('A');
        sendCmd('RESET');
      }
    }
  </script>
</body>
</html>
)rawliteral";
