<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>羽球雲端同步計分系統</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
    :root { --red: #ff3333; --green: #33ff33; --blue: #00d2ff; --bg: #000; --btn-gray: #1a1a1a; --font-score: 25vw; --font-label: 6vw; }
    body { font-family: 'Orbitron', sans-serif; background-color: #000; color: white; margin: 0; padding: 0; overflow: hidden; }

    /* --- 入口頁面 --- */
    #setup-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; z-index: 100; display: flex; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; overflow-y: auto; }
    .setup-card { background: #222; padding: 25px; border-radius: 20px; border: 2px solid var(--blue); width: 100%; max-width: 400px; text-align: center; margin-bottom: 20px; }
    .setup-card h2 { color: var(--blue); margin: 0 0 20px 0; font-size: 20px; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #000; color: #fff; font-size: 16px; box-sizing: border-box; margin-bottom: 15px; }
    .start-btn { width: 100%; padding: 15px; background: var(--blue); color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
    
    .room-list-area { width: 100%; max-width: 400px; }
    .room-list-area h3 { color: #888; font-size: 14px; text-align: left; margin-left: 10px; }
    .room-item { background: #333; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid transparent; transition: 0.3s; }
    .room-item:hover { border-color: var(--green); background: #444; }
    .room-name { font-weight: bold; color: var(--green); }
    .room-status { font-size: 12px; color: #aaa; }

    /* --- 計分板主頁面 --- */
    #score-page { display: none; flex-direction: column; height: 100vh; width: 100vw; padding: 10px; box-sizing: border-box; }
    .scoreboard-layout { display: flex; gap: 10px; flex: 1; min-height: 0; margin-bottom: 10px; }
    .score-column { flex: 1; display: flex; flex-direction: column; }
    .score-box { background: var(--bg); border: 2px solid #333; border-radius: 12px; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
    .team-header { display: flex; align-items: center; justify-content: center; z-index: 2; }
    .team-label { font-size: var(--font-label); color: var(--blue); font-weight: 900; }
    .trophy-icon { display: none; font-size: 15vw; margin-right: 10px; }
    .score-val { font-size: var(--font-score); line-height: 0.9; z-index: 2; }
    .team-a .score-val { color: var(--red); }
    .team-b .score-val { color: var(--green); }
    .srv-banner { display: none; position: absolute; top: 0; width: 100%; background: white; color: black; font-size: 8vw; text-align: center; padding: 5px 0; z-index: 3; }
    .serving .srv-banner { display: block; }
    .winner { border-color: gold !important; }
    .winner .trophy-icon { display: block; }
    .winner .score-val { animation: blink 0.6s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    
    .control-bar { display: flex; gap: 5px; height: 12vh; flex-shrink: 0; }
    .control-bar button { flex: 1; border: none; border-radius: 8px; font-weight: bold; font-size: 2.5vh; cursor: pointer; }
    .btn-a-plus { background: var(--red); color: white; }
    .btn-reset { background: transparent; border: 2px solid var(--blue); color: var(--blue); }
    .btn-b-plus { background: var(--green); color: black; }
    
    .bottom-tools { display: flex; justify-content: space-between; align-items: center; padding: 5px; font-size: 10px; color: #444; }
    .share-btn { background: #222; color: #aaa; border: 1px solid #444; padding: 4px 8px; border-radius: 4px; cursor: pointer; }

    @media (orientation: landscape) {
      :root { --font-score: 40vh; --font-label: 6vh; }
      .trophy-icon { font-size: 18vh; }
    }
  </style>
</head>
<body>

  <div id="setup-page">
    <div class="setup-card">
      <h2>🏸 建立比賽 (裁判)</h2>
      <input type="text" id="input-room" placeholder="場地名稱 (如: Court1)">
      <input type="password" id="input-pin" placeholder="設定 4 位數授權碼" maxlength="4">
      <button class="start-btn" onclick="initApp()">開場並進入</button>
    </div>

    <div class="room-list-area">
      <h3>正在進行中的場地 (觀眾點擊進入)</h3>
      <div id="room-list">正在偵測場地...</div>
    </div>
  </div>

  <div id="score-page">
    <div class="scoreboard-layout">
      <div id="panel-A" class="score-column score-box team-a" onclick="setSrv('A')">
        <div class="srv-banner">🏸</div>
        <div class="team-header"><div class="trophy-icon">🏆</div><div class="team-label">TEAM A</div></div>
        <div id="score-A" class="score-val">00</div>
      </div>
      <div id="panel-B" class="score-column score-box team-b" onclick="setSrv('B')">
        <div class="srv-banner">🏸</div>
        <div class="team-header"><div class="trophy-icon">🏆</div><div class="team-label">TEAM B</div></div>
        <div id="score-B" class="score-val">00</div>
      </div>
    </div>
    <div id="control-panel" class="control-bar">
      <button class="btn-a-plus" onclick="changeScore('A', 1)">+1</button>
      <button class="btn-reset" onclick="resetGame()">RESET</button>
      <button class="btn-b-plus" onclick="changeScore('B', 1)">+1</button>
    </div>
    <div class="bottom-tools">
      <div id="room-info-tag"></div>
      <button class="share-btn" onclick="copyShareLink()">🔗 複製觀眾連結</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB5Ngq3KczBAmJ4tRaXbt40R3d3pQpx7J0",
      authDomain: "badmintonscoreboard-ba0c6.firebaseapp.com",
      databaseURL: "https://badmintonscoreboard-ba0c6-default-rtdb.asia-southeast1.firebasedatabase.app", 
      projectId: "badmintonscoreboard-ba0c6",
      storageBucket: "badmintonscoreboard-ba0c6.firebasestorage.app",
      messagingSenderId: "201822822348",
      appId: "1:201822822348:web:caf391c4f03e6f980a0769",
    };
    firebase.initializeApp(firebaseConfig);
    const roomsRef = firebase.database().ref('rooms');

    let db;
    let localData = { scoreA: 0, scoreB: 0, srv: 'A', lastUpdate: 0 };
    let isReferee = false;
    let currentRoom = "";

    // 核心功能：清理 3 分鐘 (180,000 毫秒) 未更新的場地
    function cleanupOldRooms(rooms) {
      const now = Date.now();
      const timeout = 3 * 60 * 1000; 
      Object.keys(rooms).forEach(key => {
        if (rooms[key].lastUpdate && (now - rooms[key].lastUpdate > timeout)) {
          roomsRef.child(key).remove(); 
        }
      });
    }

    roomsRef.on('value', (snapshot) => {
      const rooms = snapshot.val();
      const listDiv = document.getElementById('room-list');
      listDiv.innerHTML = "";
      if (!rooms) {
        listDiv.innerHTML = "<div style='color:#555'>目前沒有進行中的比賽</div>";
        return;
      }
      cleanupOldRooms(rooms); // 每次列表更新時執行清理
      Object.keys(rooms).forEach(key => {
        const r = rooms[key];
        const item = document.createElement('div');
        item.className = "room-item";
        item.innerHTML = `<div><span class="room-name">${key}</span></div><div class="room-status">${r.scoreA} : ${r.scoreB} ></div>`;
        item.onclick = () => { currentRoom = key; isReferee = false; startScoreboard(); };
        listDiv.appendChild(item);
      });
    });

    // 每 30 秒自動觸發一次清理檢查
    setInterval(() => {
      roomsRef.once('value', (snapshot) => {
        const rooms = snapshot.val();
        if (rooms) cleanupOldRooms(rooms);
      });
    }, 30000);

    function initApp() {
      const room = document.getElementById('input-room').value.trim();
      const pin = document.getElementById('input-pin').value;
      if (!room) { alert("請輸入場地名稱"); return; }
      currentRoom = room;
      db = roomsRef.child(room);
      db.child('pin').once('value', (snapshot) => {
        const cloudPin = snapshot.val();
        if (!cloudPin || cloudPin === pin) {
          isReferee = true;
          db.update({ pin: pin, lastUpdate: Date.now() });
          startScoreboard();
        } else {
          alert("授權碼錯誤！將以觀眾模式進入。");
          isReferee = false;
          startScoreboard();
        }
      });
    }

    function startScoreboard() {
      db = roomsRef.child(currentRoom);
      document.getElementById('setup-page').style.display = 'none';
      document.getElementById('score-page').style.display = 'flex';
      document.getElementById('room-info-tag').innerText = "場地: " + currentRoom + (isReferee ? " [裁判]" : " [觀看]");
      if (!isReferee) {
        document.getElementById('control-panel').style.display = 'none';
        document.querySelectorAll('.score-box').forEach(el => el.onclick = null);
      }
      db.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          localData = data;
          updateUI();
        } else {
          // 如果場地被系統刪除，強制返回首頁
          alert("該場地已閒置過久或已關閉。");
          location.reload();
        }
      });
    }

    function updateUI() {
      document.getElementById('score-A').innerText = (localData.scoreA || 0).toString().padStart(2, '0');
      document.getElementById('score-B').innerText = (localData.scoreB || 0).toString().padStart(2, '0');
      document.getElementById('panel-A').classList.toggle('serving', localData.srv === 'A');
      document.getElementById('panel-B').classList.toggle('serving', localData.srv === 'B');
      const winA = (localData.scoreA >= 21 && (localData.scoreA - localData.scoreB) >= 2) || localData.scoreA === 30;
      const winB = (localData.scoreB >= 21 && (localData.scoreB - localData.scoreA) >= 2) || localData.scoreB === 30;
      document.getElementById('panel-A').classList.toggle('winner', winA);
      document.getElementById('panel-B').classList.toggle('winner', winB);
    }

    function changeScore(team, val) {
      if (!isReferee) return;
      const win = (localData.scoreA >= 21 && (localData.scoreA - localData.scoreB) >= 2) || localData.scoreA === 30 || (localData.scoreB >= 21 && (localData.scoreB - localData.scoreA) >= 2) || localData.scoreB === 30;
      if (win && val > 0) return;
      if (team === 'A') { localData.scoreA = Math.max(0, localData.scoreA + val); if (val > 0) localData.srv = 'A'; }
      else { localData.scoreB = Math.max(0, localData.scoreB + val); if (val > 0) localData.srv = 'B'; }
      // 每次計分同步更新 lastUpdate
      db.update({ scoreA: localData.scoreA, scoreB: localData.scoreB, srv: localData.srv, lastUpdate: Date.now() });
    }

    function setSrv(team) { if (isReferee) db.update({ srv: team, lastUpdate: Date.now() }); }
    function resetGame() { if (isReferee && confirm('確定重置？')) db.update({ scoreA: 0, scoreB: 0, srv: 'A', lastUpdate: Date.now() }); }

    function copyShareLink() {
      const url = window.location.origin + window.location.pathname + "?room=" + currentRoom;
      navigator.clipboard.writeText(url).then(() => alert("觀眾連結已複製！"));
    }

    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const r = urlParams.get('room');
      if (r) { currentRoom = r; isReferee = false; startScoreboard(); }
    };
  </script>
</body>
</html>
