<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>羽球雲端同步計分系統</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
    :root { --red: #ff3333; --green: #33ff33; --blue: #00d2ff; --bg: #000; --btn-gray: #1a1a1a; --font-score: 22vw; --font-label: 6vw; }
    body { font-family: 'Orbitron', sans-serif; background-color: #000; color: white; margin: 0; padding: calc(3mm + env(safe-area-inset-top)) calc(5mm + env(safe-area-inset-right)) calc(3mm + env(safe-area-inset-bottom)) calc(5mm + env(safe-area-inset-left)); box-sizing: border-box; height: 100dvh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; }

    /* --- 入口頁面 --- */
    #setup-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; z-index: 100; display: flex; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; overflow-y: auto; }
    .setup-card { background: #222; padding: 25px; border-radius: 20px; border: 2px solid var(--blue); width: 100%; max-width: 400px; text-align: center; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #000; color: #fff; font-size: 16px; box-sizing: border-box; margin-bottom: 15px; }
    .start-btn { width: 100%; padding: 15px; background: var(--blue); color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
    
    .room-list-area { width: 100%; max-width: 400px; }
    .room-item { background: #333; padding: 12px 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; position: relative; border: 1px solid transparent; }
    .room-info { flex-grow: 1; }
    .room-del-btn { background: #ff333333; color: #ff3333; border: 1px solid #ff3333; padding: 5px 10px; border-radius: 6px; font-size: 12px; margin-left: 10px; z-index: 5; }
    .deleting-status { color: #ff3333; font-size: 11px; font-weight: bold; display: block; }

    /* --- 計分板頁面 --- */
    #score-page { display: none; flex-direction: column; height: 100%; width: 100%; box-sizing: border-box; }
    .scoreboard-layout { display: flex; gap: 10px; flex: 1; min-height: 0; margin-bottom: 10px; }
    .score-column { flex: 1; display: flex; flex-direction: column; }
    
    /* 分數框設定：加入 padding-top 避免被橫幅遮擋 */
    .score-box { background: var(--bg); border: 2px solid #333; border-radius: 12px; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; cursor: pointer; padding-top: 8vw; }
    .team-label { font-size: var(--font-label); color: var(--blue); font-weight: 900; margin-bottom: 2px; }
    .score-val { font-size: var(--font-score); line-height: 0.85; z-index: 2; margin-top: -5px; }
    .team-a .score-val { color: var(--red); }
    .team-b .score-val { color: var(--green); }
    
    /* 發球橫幅：調整尺寸與定位 */
    .srv-banner { display: none; position: absolute; top: 0; left: 0; width: 100%; background: white; color: black; font-size: 5vw; text-align: center; padding: 4px 0; z-index: 3; border-radius: 10px 10px 0 0; }
    .serving .srv-banner { display: block; }

    /* --- 控制列 --- */
    .control-bar { display: flex; gap: 8px; height: 14vh; flex-shrink: 0; }
    .control-bar button { border: none; border-radius: 8px; font-weight: bold; cursor: pointer; height: 100%; padding: 0; }
    .btn-plus { flex: 2.5; font-size: 4vh; }
    .btn-minus { flex: 1; font-size: 2.5vh; background: var(--btn-gray); }
    .btn-a-plus { background: var(--red); color: white; }
    .btn-a-minus { color: var(--red); border: 1.5px solid var(--red) !important; }
    .btn-b-plus { background: var(--green); color: black; }
    .btn-b-minus { color: var(--green); border: 1.5px solid var(--green) !important; }
    .center-group { display: flex; flex-direction: column; gap: 5px; flex: 1.5; }
    .btn-reset { background: transparent; border: 2px solid var(--blue) !important; color: var(--blue); font-size: 1.6vh !important; flex: 1; }
    .btn-close { background: #222; border: 2px solid #ff3333 !important; color: #ff3333; font-size: 1.6vh !important; flex: 1; }
    
    .bottom-tools { display: flex; justify-content: space-between; align-items: center; padding-top: 5px; height: 25px; flex-shrink: 0; }
    #room-info-tag { font-size: 14px; color: var(--blue); font-weight: bold; }
    .share-btn { background: #222; color: #aaa; border: 1px solid #444; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }

    /* --- 橫向模式專屬優化 (解決擠壓與遮擋問題) --- */
    @media (orientation: landscape) { 
      :root { --font-score: 35vh; --font-label: 7vh; } 
      .control-bar { height: 22vh; } 
      /* 橫向時，強迫改用 vh 作為單位，防止字體暴衝 */
      .srv-banner { font-size: 6vh; padding: 2px 0; }
      .score-box { padding-top: 8vh; } /* 預留頂部空間給橫幅 */
    }
  </style>
</head>
<body>

  <div id="setup-page">
    <div class="setup-card">
      <h2>🏸 建立比賽</h2>
      <input type="text" id="input-room" placeholder="場地名稱 (如: Court1)">
      <input type="password" id="input-pin" placeholder="4 位數授權碼" maxlength="4">
      <button class="start-btn" onclick="initApp()">開場並進入</button>
    </div>
    <div class="room-list-area">
      <h3 style="font-size: 14px; color: #888;">正在進行中的場地</h3>
      <div id="room-list">正在連線資料庫...</div>
    </div>
  </div>

  <div id="score-page">
    <div class="scoreboard-layout">
      <div id="panel-A" class="score-column score-box team-a" onclick="setSrv('A')">
        <div class="srv-banner">🏸 SERVING</div>
        <div class="team-label">TEAM A</div>
        <div id="score-A" class="score-val">00</div>
      </div>
      <div id="panel-B" class="score-column score-box team-b" onclick="setSrv('B')">
        <div class="srv-banner">🏸 SERVING</div>
        <div class="team-label">TEAM B</div>
        <div id="score-B" class="score-val">00</div>
      </div>
    </div>
    
    <div id="control-panel" class="control-bar">
      <button class="btn-plus btn-a-plus" onclick="changeScore('A', 1)">+1</button>
      <button class="btn-minus btn-a-minus" onclick="changeScore('A', -1)">-1</button>
      <div class="center-group">
        <button class="btn-reset" onclick="resetScore()">RESET</button>
        <button class="btn-close" onclick="closeRoomManual()">CLOSE</button>
      </div>
      <button class="btn-plus btn-b-plus" onclick="changeScore('B', 1)">+1</button>
      <button class="btn-minus btn-b-minus" onclick="changeScore('B', -1)">-1</button>
    </div>
    <div class="bottom-tools"><div id="room-info-tag"></div><button class="share-btn" onclick="copyShareLink()">🔗 複製連結</button></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB5Ngq3KczBAmJ4tRaXbt40R3d3pQpx7J0",
      authDomain: "badmintonscoreboard-ba0c6.firebaseapp.com",
      databaseURL: "https://badmintonscoreboard-ba0c6-default-rtdb.asia-southeast1.firebasedatabase.app", 
      projectId: "badmintonscoreboard-ba0c6",
    };
    firebase.initializeApp(firebaseConfig);
    const roomsRef = firebase.database().ref('rooms');

    let db;
    let localData = { scoreA: 0, scoreB: 0, srv: 'A' };
    let isReferee = false;
    let currentRoom = "";

    roomsRef.on('value', (snapshot) => {
      const rooms = snapshot.val();
      const listDiv = document.getElementById('room-list');
      listDiv.innerHTML = "";
      if (!rooms) { listDiv.innerHTML = "<div style='color:#555; text-align:center;'>目前無場地</div>"; return; }

      Object.keys(rooms).forEach(key => {
        const data = rooms[key];
        const item = document.createElement('div');
        item.className = "room-item";
        
        let deleteInfo = "";
        if (data.deleteAt) {
          const timeLeft = Math.ceil((data.deleteAt - Date.now()) / 1000);
          if (timeLeft <= 0) {
            roomsRef.child(key).remove(); 
            return;
          }
          deleteInfo = `<span class="deleting-status">⚠️ 刪除中: ${timeLeft}s</span>`;
        }

        item.innerHTML = `
          <div class="room-info" onclick="joinRoom('${key}')">
            <span style="color:var(--green); font-weight:bold;">${key}</span>
            <span style="color:#aaa; font-size:12px; margin-left:10px;">${data.scoreA||0} : ${data.scoreB||0}</span>
            ${deleteInfo}
          </div>
          <button class="room-del-btn" onclick="requestDelete('${key}')">🗑️ 刪除</button>
        `;
        listDiv.appendChild(item);
      });
    });

    setInterval(() => { if (document.getElementById('setup-page').style.display !== 'none') roomsRef.once('value'); }, 1000);

    function requestDelete(roomName) {
      if (confirm(`確定要在 3 分鐘後刪除 "${roomName}" 嗎？\n(若有人改動分數將自動取消刪除)`)) {
        roomsRef.child(roomName).update({ deleteAt: Date.now() + 180000 });
      }
    }

    function joinRoom(roomName) {
      currentRoom = roomName;
      isReferee = false;
      startScoreboard();
    }

    function initApp() {
      const room = document.getElementById('input-room').value.trim();
      const pin = document.getElementById('input-pin').value;
      if (!room) return;
      currentRoom = room;
      db = roomsRef.child(room);
      db.once('value').then((snapshot) => {
        const cloudData = snapshot.val();
        if (!cloudData || cloudData.pin === pin) {
          isReferee = true;
          return db.update({ pin: pin, scoreA: cloudData?.scoreA||0, scoreB: cloudData?.scoreB||0, srv: cloudData?.srv||'A', deleteAt: null });
        } else { alert("授權碼錯誤"); throw 'error'; }
      }).then(startScoreboard);
    }

    function startScoreboard() {
      db = roomsRef.child(currentRoom);
      document.getElementById('setup-page').style.display = 'none';
      document.getElementById('score-page').style.display = 'flex';
      document.getElementById('room-info-tag').innerText = currentRoom;
      if (!isReferee) {
        document.getElementById('control-panel').style.display = 'none';
        document.querySelectorAll('.score-box').forEach(el => el.onclick = null);
      }
      db.on('value', (snapshot) => {
        if (!snapshot.exists()) { location.reload(); return; }
        localData = snapshot.val();
        updateUI();
      });
    }

    function updateUI() {
      document.getElementById('score-A').innerText = (localData.scoreA || 0).toString().padStart(2, '0');
      document.getElementById('score-B').innerText = (localData.scoreB || 0).toString().padStart(2, '0');
      document.getElementById('panel-A').classList.toggle('serving', localData.srv === 'A');
      document.getElementById('panel-B').classList.toggle('serving', localData.srv === 'B');
    }

    function changeScore(team, val) {
      if (!isReferee) return;
      let sa = localData.scoreA || 0; let sb = localData.scoreB || 0; let srv = localData.srv || 'A';
      if (team === 'A') { sa = Math.max(0, sa + val); if (val > 0) srv = 'A'; }
      else { sb = Math.max(0, sb + val); if (val > 0) srv = 'B'; }
      db.update({ scoreA: sa, scoreB: sb, srv: srv, deleteAt: null });
    }

    function setSrv(team) { if (isReferee) db.update({ srv: team, deleteAt: null }); }
    function resetScore() { if (isReferee && confirm('重置分數？')) db.update({ scoreA: 0, scoreB: 0, srv: 'A', deleteAt: null }); }
    function closeRoomManual() { if (isReferee && confirm('關閉場地？')) db.remove().then(() => location.reload()); }
    function copyShareLink() {
      const url = window.location.origin + window.location.pathname + "?room=" + encodeURIComponent(currentRoom);
      navigator.clipboard.writeText(url).then(() => alert("連結已複製"));
    }

    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const r = urlParams.get('room');
      if (r) { currentRoom = r; isReferee = false; startScoreboard(); }
    };
  </script>
</body>
</html>
