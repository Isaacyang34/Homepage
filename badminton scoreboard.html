<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>羽球雲端同步計分系統</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
    :root { 
      --red: #ff3333; --green: #33ff33; --blue: #00d2ff; --bg: #000; --btn-gray: #1a1a1a; 
      --font-score: 22vw; --font-label: 6vw; 
    }
    
    body { 
      font-family: 'Orbitron', sans-serif; background-color: #000; color: white; margin: 0; 
      padding: calc(5mm + env(safe-area-inset-top)) calc(5mm + env(safe-area-inset-right)) calc(5mm + env(safe-area-inset-bottom)) calc(5mm + env(safe-area-inset-left));
      box-sizing: border-box; height: 100dvh; width: 100vw; overflow: hidden; display: flex; flex-direction: column;
    }

    /* --- 入口頁面 --- */
    #setup-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; z-index: 100; display: flex; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; overflow-y: auto; }
    .setup-card { background: #222; padding: 25px; border-radius: 20px; border: 2px solid var(--blue); width: 100%; max-width: 400px; text-align: center; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #000; color: #fff; font-size: 16px; box-sizing: border-box; margin-bottom: 15px; }
    .start-btn { width: 100%; padding: 15px; background: var(--blue); color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
    .room-item { background: #333; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; width: 100%; max-width: 400px; }

    /* --- 計分板頁面 --- */
    #score-page { display: none; flex-direction: column; height: 100%; width: 100%; box-sizing: border-box; }
    .scoreboard-layout { display: flex; gap: 10px; flex: 1; min-height: 0; margin-bottom: 10px; }
    .score-column { flex: 1; display: flex; flex-direction: column; }
    .score-box { background: var(--bg); border: 2px solid #333; border-radius: 12px; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
    .score-val { font-size: var(--font-score); line-height: 0.9; z-index: 2; }
    .team-a .score-val { color: var(--red); }
    .team-b .score-val { color: var(--green); }
    .srv-banner { display: none; position: absolute; top: 0; width: 100%; background: white; color: black; font-size: 7vw; text-align: center; padding: 2px 0; z-index: 3; }
    .serving .srv-banner { display: block; }

    /* --- 控制列 --- */
    .control-bar { display: flex; gap: 8px; height: 16vh; flex-shrink: 0; }
    .control-bar button { border: none; border-radius: 8px; font-weight: bold; cursor: pointer; height: 100%; }
    .btn-plus { flex: 2.5; font-size: 4vh; }
    .btn-minus { flex: 1; font-size: 2.2vh; background: var(--btn-gray); }
    .btn-a-plus { background: var(--red); color: white; }
    .btn-a-minus { color: var(--red); border: 1.5px solid var(--red) !important; }
    .btn-b-plus { background: var(--green); color: black; }
    .btn-b-minus { color: var(--green); border: 1.5px solid var(--green) !important; }
    .center-group { display: flex; flex-direction: column; gap: 5px; flex: 1.5; }
    .btn-reset { background: transparent; border: 2px solid var(--blue) !important; color: var(--blue); font-size: 1.4vh !important; flex: 1; }
    .btn-close { background: #222; border: 2px solid #ff3333 !important; color: #ff3333; font-size: 1.4vh !important; flex: 1; }
    
    .bottom-tools { display: flex; justify-content: space-between; align-items: center; padding-top: 5px; height: 30px; }
    #room-info-tag { font-size: 16px; color: var(--blue); font-weight: bold; }
    .share-btn { background: #222; color: #aaa; border: 1px solid #444; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }

    @media (orientation: landscape) {
      :root { --font-score: 35vh; --font-label: 6vh; }
      .control-bar { height: 22vh; }
    }
  </style>
</head>
<body>

  <div id="setup-page">
    <div class="setup-card">
      <h2>🏸 建立比賽 (裁判)</h2>
      <input type="text" id="input-room" placeholder="場地名稱 (如: Court1)">
      <input type="password" id="input-pin" placeholder="設定 4 位數授權碼" maxlength="4">
      <button class="start-btn" onclick="initApp()">開場並進入</button>
    </div>
    <div class="room-list-area" style="width:100%; display:flex; flex-direction:column; align-items:center;">
      <h3 style="font-size: 14px; color: #888;">正在進行中的場地</h3>
      <div id="room-list" style="width:100%; max-width:400px;">偵測中...</div>
    </div>
  </div>

  <div id="score-page">
    <div class="scoreboard-layout">
      <div id="panel-A" class="score-column score-box team-a" onclick="setSrv('A')">
        <div class="srv-banner">🏸</div>
        <div id="score-A" class="score-val">00</div>
      </div>
      <div id="panel-B" class="score-column score-box team-b" onclick="setSrv('B')">
        <div class="srv-banner">🏸</div>
        <div id="score-B" class="score-val">00</div>
      </div>
    </div>
    
    <div id="control-panel" class="control-bar">
      <button class="btn-plus btn-a-plus" onclick="changeScore('A', 1)">+1</button>
      <button class="btn-minus btn-a-minus" onclick="changeScore('A', -1)">-1</button>
      <div class="center-group">
        <button class="btn-reset" onclick="resetScore()">RESET</button>
        <button class="btn-close" onclick="closeRoomManual()">CLOSE</button>
      </div>
      <button class="btn-plus btn-b-plus" onclick="changeScore('B', 1)">+1</button>
      <button class="btn-minus btn-b-minus" onclick="changeScore('B', -1)">-1</button>
    </div>

    <div class="bottom-tools">
      <div id="room-info-tag"></div>
      <button class="share-btn" onclick="copyShareLink()">🔗 複製連結</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB5Ngq3KczBAmJ4tRaXbt40R3d3pQpx7J0",
      authDomain: "badmintonscoreboard-ba0c6.firebaseapp.com",
      databaseURL: "https://badmintonscoreboard-ba0c6-default-rtdb.asia-southeast1.firebasedatabase.app", 
      projectId: "badmintonscoreboard-ba0c6",
    };
    firebase.initializeApp(firebaseConfig);
    const roomsRef = firebase.database().ref('rooms');

    let db;
    let localData = { scoreA: 0, scoreB: 0, srv: 'A' };
    let isReferee = false;
    let currentRoom = "";

    // --- 自動清理機制 ---
    function performCleanup(rooms) {
      if (!rooms) return;
      const now = Date.now();
      const EXPIRE_TIME = 5 * 60 * 1000; // 5分鐘無活動即判定為過期
      Object.keys(rooms).forEach(key => {
        if (rooms[key].lastActive && (now - rooms[key].lastActive > EXPIRE_TIME)) {
          roomsRef.child(key).remove();
        }
      });
    }

    roomsRef.on('value', (snapshot) => {
      const rooms = snapshot.val();
      performCleanup(rooms); // 每次列表更新都觸發檢查
      const listDiv = document.getElementById('room-list');
      listDiv.innerHTML = "";
      if (!rooms) { listDiv.innerHTML = "<div style='color:#555; text-align:center;'>無比賽</div>"; return; }
      Object.keys(rooms).forEach(key => {
        const item = document.createElement('div');
        item.className = "room-item";
        item.innerHTML = `<div><span class="room-name">${key}</span></div><div style="color:#aaa">${rooms[key].scoreA||0}:${rooms[key].scoreB||0} ></div>`;
        item.onclick = () => { currentRoom = key; isReferee = false; startScoreboard(); };
        listDiv.appendChild(item);
      });
    });

    function initApp() {
      const room = document.getElementById('input-room').value.trim();
      const pin = document.getElementById('input-pin').value;
      if (!room) return;
      currentRoom = room;
      db = roomsRef.child(room);
      db.child('pin').once('value', (snapshot) => {
        const cloudPin = snapshot.val();
        if (!cloudPin || cloudPin === pin) {
          isReferee = true;
          db.update({ pin: pin, lastActive: Date.now() });
          db.onDisconnect().remove(); 
          // 裁判心跳偵測：每 30 秒更新一次在線時間
          setInterval(() => { if (isReferee) db.update({ lastActive: Date.now() }); }, 30000);
          startScoreboard();
        } else { alert("授權碼錯誤"); }
      });
    }

    function startScoreboard() {
      db = roomsRef.child(currentRoom);
      document.getElementById('setup-page').style.display = 'none';
      document.getElementById('score-page').style.display = 'flex';
      document.getElementById('room-info-tag').innerText = currentRoom;
      if (!isReferee) {
        document.getElementById('control-panel').style.display = 'none';
        document.querySelectorAll('.score-box').forEach(el => el.onclick = null);
      }
      db.on('value', (snapshot) => {
        if (!snapshot.exists()) { alert("場地已關閉"); location.reload(); return; }
        localData = snapshot.val();
        updateUI();
      });
    }

    function updateUI() {
      document.getElementById('score-A').innerText = (localData.scoreA || 0).toString().padStart(2, '0');
      document.getElementById('score-B').innerText = (localData.scoreB || 0).toString().padStart(2, '0');
      document.getElementById('panel-A').classList.toggle('serving', localData.srv === 'A');
      document.getElementById('panel-B').classList.toggle('serving', localData.srv === 'B');
    }

    function changeScore(team, val) {
      if (!isReferee) return;
      if (team === 'A') localData.scoreA = Math.max(0, (localData.scoreA || 0) + val);
      else localData.scoreB = Math.max(0, (localData.scoreB || 0) + val);
      db.update({ scoreA: localData.scoreA, scoreB: localData.scoreB, lastActive: Date.now() });
    }

    function setSrv(team) { if (isReferee) db.update({ srv: team, lastActive: Date.now() }); }
    function resetScore() { if (isReferee && confirm('重置分數？')) db.update({ scoreA: 0, scoreB: 0, lastActive: Date.now() }); }
    function closeRoomManual() { if (isReferee && confirm('關閉場地？')) db.remove().then(() => location.reload()); }
    function copyShareLink() {
      const url = window.location.origin + window.location.pathname + "?room=" + encodeURIComponent(currentRoom);
      navigator.clipboard.writeText(url).then(() => alert("連結已複製"));
    }

    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const r = urlParams.get('room');
      if (r) { currentRoom = r; isReferee = false; startScoreboard(); }
    };
  </script>
</body>
</html>
