<body class="bg-slate-900 text-slate-100 font-sans antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ==========================================
    // Firebase 連線配置
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyAKpQYOS7bkimn2cy0gfqZBGjVDRKoy2mA",
      authDomain: "shuttlejoy-badminton.firebaseapp.com",
      databaseURL: "https://shuttlejoy-badminton-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "shuttlejoy-badminton",
      storageBucket: "shuttlejoy-badminton.firebasestorage.app",
      messagingSenderId: "87986896876",
      appId: "1:87986896876:web:7e4d95ed8c2ae76372cac9"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ==========================================
    // 輕量同步 64 位元雙重雜湊演算法 (全環境相容)
    // ==========================================
    function hashString(str) {
      if (!str) return '';
      const salted = "shuttleflow_v1_salt_" + str;
      let h1 = 0x811c9dc5;
      for (let i = 0; i < salted.length; i++) {
        h1 ^= salted.charCodeAt(i);
        h1 += (h1 << 1) + (h1 << 4) + (h1 << 7) + (h1 << 8) + (h1 << 24);
      }
      let h2 = 0x84222325;
      for (let i = salted.length - 1; i >= 0; i--) {
        h2 ^= salted.charCodeAt(i);
        h2 += (h2 << 1) + (h2 << 4) + (h2 << 7) + (h2 << 8) + (h2 << 24);
      }
      const s1 = ("00000000" + (h1 >>> 0).toString(16)).slice(-8);
      const s2 = ("00000000" + (h2 >>> 0).toString(16)).slice(-8);
      return s1 + s2;
    }

    // ==========================================
    // UserCard 球員球衣卡片元件 (React.memo 優化渲染)
    // ==========================================
    const UserCard = React.memo(({ 
      user, isCoolingDown, timeString, isSelected, canMoveCard, operable, 
      isMine, isUserMainAdmin, isUserSubAdmin, isAdmin, onSelect, onEdit, onTogglePayment, onRequestClaim 
    }) => {
      const touchTimer = useRef(null);
      const isLongPress = useRef(false);
      const touchStartPos = useRef({ x: 0, y: 0 });

      // 球衣主題色彩
      const getJerseyTheme = (gender) => {
        switch (gender) { 
          case 'blue': return {
            border: 'border-blue-400/80',
            bg: 'bg-gradient-to-r from-blue-900/90 to-slate-900',
            name: 'text-blue-300 font-bold',
            badge: 'bg-blue-950 text-blue-300 border-blue-600/50'
          };
          case 'red': return {
            border: 'border-rose-400/80',
            bg: 'bg-gradient-to-r from-rose-950/90 to-slate-900',
            name: 'text-rose-300 font-bold',
            badge: 'bg-rose-950 text-rose-300 border-rose-600/50'
          };
          default: return {
            border: 'border-emerald-500/70',
            bg: 'bg-gradient-to-r from-emerald-950/90 to-slate-900',
            name: 'text-emerald-300 font-bold',
            badge: 'bg-emerald-950 text-emerald-300 border-emerald-600/50'
          };
        }
      };

      const theme = getJerseyTheme(user.gender);

      const handleStart = (e) => {
        isLongPress.current = false;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        touchStartPos.current = { x: clientX, y: clientY };

        touchTimer.current = setTimeout(() => {
          isLongPress.current = true;
          if (navigator.vibrate) navigator.vibrate(50);
          if (operable) onEdit(user);
          else onRequestClaim(user);
        }, 550); 
      };

      const handleMove = (e) => {
        if (!touchTimer.current) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        if (Math.abs(clientX - touchStartPos.current.x) > 10 || Math.abs(clientY - touchStartPos.current.y) > 10) {
           clearTimeout(touchTimer.current);
        }
      };

      const handleEnd = () => clearTimeout(touchTimer.current);

      const handleClick = (e) => {
        e.stopPropagation();
        if (isLongPress.current) return; 
        if (canMoveCard) {
          onSelect(user.id);
        } else if (!isMine && !isAdmin) {
          onRequestClaim(user);
        }
      };

      const hasCrown = isUserMainAdmin || isUserSubAdmin;
      const crownTitle = isUserMainAdmin ? "主管理員" : (isUserSubAdmin ? "副管理員" : "");

      return (
        <div 
          onTouchStart={handleStart} onTouchMove={handleMove} onTouchEnd={handleEnd} 
          onMouseDown={handleStart} onMouseMove={handleMove} onMouseUp={handleEnd} onMouseLeave={handleEnd}
          onClick={handleClick}
          onContextMenu={(e) => { 
            e.preventDefault(); 
            if (operable) onEdit(user); 
            else onRequestClaim(user); 
          }}
          className={`no-select relative flex flex-col px-3 py-2 rounded-xl shadow-md border text-sm select-none transition-all duration-200 
            ${theme.bg} ${theme.border}
            ${canMoveCard ? 'cursor-pointer hover:scale-105 hover:shadow-emerald-500/20 active:scale-95' : 'cursor-pointer opacity-90'} 
            ${isSelected ? 'ring-4 ring-yellow-400 scale-110 z-20 shadow-2xl bg-slate-800' : ''}
            ${isCoolingDown ? 'ring-2 ring-yellow-500/80 bg-yellow-950/80' : ''}`}
        >
          <div className="flex items-center justify-between gap-1.5">
            <div className="flex items-center gap-1.5 truncate">
              <span className="text-base select-none">🏸</span>
              <span className={`truncate text-sm ${theme.name}`}>{user.name}</span>
              
              {user.level ? (
                <span className={`text-[10px] px-1.5 py-0.5 rounded border font-semibold ${theme.badge}`}>
                  {user.level}
                </span>
              ) : null}

              {hasCrown ? (
                <span className="text-sm select-none" title={crownTitle}>
                  {isUserMainAdmin ? '👑' : '⭐'}
                </span>
              ) : null}

              {isAdmin && user.customTags && user.customTags !== '💰' ? (
                <span className="bg-purple-900/80 text-purple-200 border border-purple-500/50 px-1 rounded text-[10px] font-mono">
                  {user.customTags}
                </span>
              ) : null}
            </div>

            <div className="flex items-center gap-1 shrink-0">
              {isCoolingDown ? (
                <span className="text-[11px] text-yellow-300 font-bold font-mono bg-yellow-900/80 border border-yellow-500/60 px-1.5 py-0.5 rounded animate-pulse">
                  ⏱ {timeString}
                </span>
              ) : null}
              
              {isAdmin ? (
                <button 
                  onClick={(e) => { e.stopPropagation(); onTogglePayment(user.id); }} 
                  title="切換繳費狀態"
                  className={`p-1 rounded text-xs transition active:scale-90 ${user.customTags === '💰' ? 'bg-amber-500/30 border border-amber-400 text-amber-300 shadow' : 'bg-slate-800 border border-slate-700 text-slate-500 opacity-60'}`}
                >
                  💰
                </button>
              ) : null}
            </div>
          </div>
          
          {/* 我的標籤 */}
          {isMine && !hasCrown ? (
            <span className="absolute -top-2 -right-2 bg-gradient-to-r from-emerald-500 to-teal-500 text-white text-[10px] font-black px-2 py-0.5 rounded-full shadow-lg border border-emerald-300">
              我的
            </span>
          ) : null}

          {/* 認領按鈕 */}
          {!isMine && !isAdmin && user.hasClaimCode ? (
            <span 
              onClick={(e) => { e.stopPropagation(); onRequestClaim(user); }}
              title="這是您的卡片嗎？點此認領" 
              className="absolute -top-2 -right-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-[9px] px-2 py-0.5 rounded-full shadow cursor-pointer transition active:scale-95"
            >
              🔑 認領
            </span>
          ) : null}
        </div>
      );
    });

    // ==========================================
    // 大廳元件 (Landing Page)
    // ==========================================
    function LandingPage({ onJoinRoom, onCreateRoom }) {
      const [roomInput, setRoomInput] = useState('');
      const [roomName, setRoomName] = useState('快樂打羽球 🏸');
      const [maxUsers, setMaxUsers] = useState(32);
      
      const handleCreate = () => {
        if (!roomName.trim()) return alert("請輸入球局名稱！");
        if (maxUsers < 1 || maxUsers > 32) return alert("人數上限請設定在 1 到 32 之間！");
        const newRoomId = Math.random().toString(36).substring(2, 8).toUpperCase();
        onCreateRoom(newRoomId, roomName.trim(), maxUsers);
      };

      const handleJoin = () => {
        const clean = roomInput.trim().toUpperCase();
        if (clean.length === 6) {
          onJoinRoom(clean);
        } else {
          alert('請輸入完整的 6 碼球局代號');
        }
      };

      return (
        <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4 text-slate-100 font-sans relative overflow-hidden">
          {/* 背景羽球場線條光效 */}
          <div className="absolute inset-0 opacity-10 pointer-events-none">
            <div className="w-full h-full border-8 border-emerald-500/40 m-auto max-w-4xl max-h-[85vh] relative">
              <div className="absolute inset-x-0 top-1/2 h-1 bg-emerald-400/50"></div>
              <div className="absolute inset-y-0 left-1/2 w-1 bg-emerald-400/50"></div>
            </div>
          </div>

          <div className="bg-slate-900/90 backdrop-blur-xl p-8 rounded-3xl shadow-2xl max-w-md w-full relative overflow-hidden border border-emerald-500/30 z-10">
            <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-emerald-500 via-teal-400 to-yellow-400"></div>
            
            <div className="text-center mb-6">
              <div className="inline-block text-5xl mb-2 animate-shuttle">🏸</div>
              <h1 className="text-4xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-300 to-yellow-300">
                羽樂排
              </h1>
              <div className="inline-block bg-emerald-950 border border-emerald-500/40 text-emerald-300 text-xs px-2.5 py-0.5 rounded-full font-bold mt-1 font-mono tracking-widest">
                ShuttleJoy v1.0
              </div>
            </div>
            
            <div className="bg-slate-800/80 p-5 rounded-2xl mb-6 border border-slate-700 shadow-inner">
              <h2 className="font-bold text-emerald-300 mb-3 text-center text-sm flex items-center justify-center gap-1.5">
                <span>🏸 建立全新羽球局</span>
              </h2>
              <label className="block text-xs text-slate-400 mb-1">球局名稱</label>
              <input 
                type="text" 
                value={roomName} 
                onChange={e => setRoomName(e.target.value)} 
                className="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-emerald-500 mb-3 text-sm font-medium" 
              />
              <label className="block text-xs text-slate-400 mb-1">人數上限 (最多 32 人)</label>
              <input 
                type="number" 
                value={maxUsers} 
                max={32} 
                min={1} 
                onChange={e => setMaxUsers(Number(e.target.value))} 
                className="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-emerald-500 mb-4 text-sm font-medium" 
              />
              <button 
                onClick={handleCreate} 
                className="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-black py-3 rounded-xl shadow-lg transition active:scale-95 text-sm flex items-center justify-center gap-2"
              >
                <span>🏸 產生羽球房間 (獲取主辦人權限)</span>
              </button>
            </div>
            
            <div className="flex items-center my-4 opacity-40">
              <div className="flex-1 h-px bg-slate-600"></div>
              <span className="px-3 text-slate-400 text-xs">或加入現有球局</span>
              <div className="flex-1 h-px bg-slate-600"></div>
            </div>

            <div className="flex gap-2 mb-6">
              <input 
                type="text" 
                placeholder="輸入 6 碼球局代號" 
                value={roomInput} 
                onChange={e => setRoomInput(e.target.value.toUpperCase())} 
                onKeyDown={e => { if (e.key === 'Enter') handleJoin(); }}
                className="flex-1 px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-emerald-300 focus:outline-none focus:border-emerald-500 text-center tracking-widest font-mono font-black uppercase text-base" 
                maxLength={6} 
              />
              <button 
                onClick={handleJoin} 
                className="bg-teal-600 hover:bg-teal-500 text-white font-bold px-6 rounded-xl transition active:scale-95 text-sm"
              >
                入場
              </button>
            </div>

            <div className="pt-4 border-t border-slate-800 text-center text-xs font-mono space-y-1">
              <p className="text-emerald-400 font-medium">✨ 支援手機末 3 碼取回名子 • 一機一卡防洗版</p>
              <p className="text-slate-500">羽樂排 ShuttleJoy v1.0 • 由 <span className="text-emerald-300 font-bold">[羽球狂熱份子]</span> 打造</p>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 房間主程式元件
    // ==========================================
    function ShuttleFlowRoom({ roomId, initRoomName, initMaxUsers, isCreatingNew, onLeave }) {
      const roomRef = useMemo(() => db.ref(`rooms/${roomId}`), [roomId]);
      
      // 永久持久化 deviceId
      const [deviceId] = useState(() => {
        let id = localStorage.getItem('shuttleflow_device_id');
        if (!id) { 
          id = 'device_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9); 
          localStorage.setItem('shuttleflow_device_id', id); 
        }
        return id;
      });

      const [showBrowserWarning, setShowBrowserWarning] = useState(() => localStorage.getItem('shuttleflow_browser_warned') !== 'true');
      const [now, setNow] = useState(Date.now());
      useEffect(() => { 
        const timer = setInterval(() => setNow(Date.now()), 1000); 
        return () => clearInterval(timer); 
      }, []);

      // 監聽 Firebase 底層連線狀態
      const [isOnline, setIsOnline] = useState(true);
      useEffect(() => {
        const connectedRef = db.ref(".info/connected");
        const onConnChange = (snap) => setIsOnline(snap.val() === true);
        connectedRef.on("value", onConnChange);
        return () => connectedRef.off("value", onConnChange);
      }, []);

      const [data, setData] = useState(null);
      const [isDbLoaded, setIsDbLoaded] = useState(false);
      const [roomNotFound, setRoomNotFound] = useState(false);

      const [selectedUserId, setSelectedUserId] = useState(null);
      
      // 成員編輯 Modal 狀態
      const [editingUser, setEditingUser] = useState(null);
      const [editName, setEditName] = useState('');
      const [editGender, setEditGender] = useState('blue');
      const [editLevel, setEditLevel] = useState('');
      const [editCustomTag, setEditCustomTag] = useState('');
      const [adminNewClaimCode, setAdminNewClaimCode] = useState('');
      
      // 新增成員狀態 (取回碼預設為必填)
      const [newName, setNewName] = useState('');
      const [newGender, setNewGender] = useState('blue');
      const [newLevel, setNewLevel] = useState('');
      const [newClaimCode, setNewClaimCode] = useState('');
      
      // 場地與對話框狀態
      const [editingCourtId, setEditingCourtId] = useState(null);
      const [editCourtName, setEditCourtName] = useState('');
      const [showQRModal, setShowQRModal] = useState(false);
      const [showSettings, setShowSettings] = useState(false);

      // 取回名子 / 認領 Modal 狀態
      const [showClaimModal, setShowClaimModal] = useState(false);
      const [claimTargetUserId, setClaimTargetUserId] = useState('');
      const [inputClaimCode, setInputClaimCode] = useState('');
      const [claimWithCompanions, setClaimWithCompanions] = useState(true);

      // 管理員救援 Modal 狀態
      const [showAdminRecoveryModal, setShowAdminRecoveryModal] = useState(false);
      const [inputAdminRecoveryKey, setInputAdminRecoveryKey] = useState('');

      // 防重複下場 Debounce Ref
      const isFinishingMatchRef = useRef(false);

      // 監聽 Firebase 房間資料
      useEffect(() => {
        const onValueChange = (snapshot) => {
          const val = snapshot.val();
          setIsDbLoaded(true);
          
          if (val) {
            setData(val);
            setRoomNotFound(false);

            // 副管理員連結自動認證
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('role') === 'subadmin') {
              const subAdmins = val.subAdminDevices || [];
              if (deviceId !== val.adminId && !subAdmins.includes(deviceId)) {
                if (subAdmins.length < 2) {
                  roomRef.update({ subAdminDevices: [...subAdmins, deviceId] });
                  alert("🎉 授權成功！您已取得「副管理員」管理權限！");
                } else {
                  alert("⚠️ 副管理員名額已滿 (最多 2 位)！");
                }
              }
              const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?room=' + roomId;
              window.history.replaceState({path:newUrl}, '', newUrl);
            }
          } else {
            // 資料為空：區分新建或錯誤房號
            if (isCreatingNew) {
              const recoveryKey = Math.floor(100000 + Math.random() * 900000).toString();
              const recoveryHash = hashString(roomId + "_admin_" + recoveryKey);
              
              roomRef.set({ 
                adminId: deviceId, 
                adminRecoveryHash: recoveryHash,
                adminRecoveryKey: recoveryKey,
                roomName: initRoomName || '快樂打羽球 🏸', 
                maxUsers: initMaxUsers || 32,
                maxCardsPerDevice: 1, // 預設每人限報名 1 位
                courts: [
                  { id: 'c1', name: '1 號場 (球場A) 🏸', playing: [], waiting: [], isMatchStarted: false },
                  { id: 'c2', name: '2 號場 (球場B) 🏸', playing: [], waiting: [], isMatchStarted: false }
                ], 
                freeUsers: [], 
                isLocked: false, 
                enableRestRule: true, 
                restMinutes: 5, 
                adminOnlyDrag: false,
                subAdminDevices: [] 
              });
            } else {
              setRoomNotFound(true);
            }
          }
        };

        roomRef.on('value', onValueChange);
        return () => roomRef.off('value', onValueChange);
      }, [roomId, deviceId, initRoomName, initMaxUsers, isCreatingNew, roomRef]);

      const syncData = useCallback((updates) => {
        if (!isOnline) {
          alert("⚠️ 網路目前處於離線狀態，請等候恢復連線後再操作！");
          return;
        }
        roomRef.update(updates);
      }, [roomRef, isOnline]);

      if (!isDbLoaded) {
        return (
          <div className="flex flex-col items-center justify-center min-h-screen bg-slate-950 font-bold text-emerald-400 gap-3">
            <div className="text-4xl animate-shuttle">🏸</div>
            <div className="w-10 h-10 border-4 border-emerald-400 border-t-transparent rounded-full animate-spin"></div>
            <span className="font-mono text-sm tracking-widest">羽樂排 雲端球局同步中...</span>
          </div>
        );
      }

      if (roomNotFound) {
        return (
          <div className="flex flex-col items-center justify-center min-h-screen bg-slate-950 p-4 text-center text-slate-200">
            <div className="bg-slate-900 p-8 rounded-3xl max-w-sm w-full border border-emerald-500/30 shadow-2xl">
              <span className="text-5xl mb-4 block animate-bounce">🏸</span>
              <h2 className="text-xl font-bold text-red-400 mb-2">找不到此羽球局</h2>
              <p className="text-slate-400 text-sm mb-6">查無代號為 <span className="text-emerald-400 font-mono font-bold">{roomId}</span> 的球局，可能是房號有誤或該球局已結束。</p>
              <div className="flex flex-col gap-3">
                <button onClick={onLeave} className="w-full bg-slate-800 hover:bg-slate-700 text-white py-2.5 rounded-xl font-bold text-sm transition">
                  返回大廳重新輸入
                </button>
                <button 
                  onClick={() => {
                    const recoveryKey = Math.floor(100000 + Math.random() * 900000).toString();
                    const recoveryHash = hashString(roomId + "_admin_" + recoveryKey);
                    roomRef.set({ 
                      adminId: deviceId, 
                      adminRecoveryHash: recoveryHash,
                      adminRecoveryKey: recoveryKey,
                      roomName: '快樂打羽球 🏸', 
                      maxUsers: 32,
                      maxCardsPerDevice: 1,
                      courts: [
                        { id: 'c1', name: '1 號場 (球場A) 🏸', playing: [], waiting: [], isMatchStarted: false },
                        { id: 'c2', name: '2 號場 (球場B) 🏸', playing: [], waiting: [], isMatchStarted: false }
                      ], 
                      freeUsers: [], 
                      isLocked: false, 
                      enableRestRule: true, 
                      restMinutes: 5, 
                      adminOnlyDrag: false,
                      subAdminDevices: [] 
                    });
                  }} 
                  className="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-xl font-bold text-sm shadow transition"
                >
                  以此代號直接建立新球局
                </button>
              </div>
            </div>
          </div>
        );
      }

      if (!data) return null;

      const courts = data.courts || [];
      const freeUsers = data.freeUsers || [];
      const subAdminDevices = data.subAdminDevices || [];
      const { isLocked, enableRestRule, restMinutes, roomName, maxUsers, adminOnlyDrag, adminRecoveryKey, maxCardsPerDevice } = data;

      const allUsers = [...freeUsers, ...courts.flatMap(c => [...(c.playing||[]), ...(c.waiting||[])])];
      
      // 權限判定
      const isMainAdmin = deviceId === data.adminId;
      const isSubAdmin = subAdminDevices.includes(deviceId);
      const isAdmin = isMainAdmin || isSubAdmin;
      const currentSubAdminCount = subAdminDevices.length;

      // 檢查此裝置是否擁有卡片
      const myCards = allUsers.filter(u => u.ownerId === deviceId);
      const hasMyCard = myCards.length > 0;

      // 操作權限判定
      const canOperate = (user) => {
        if (!user) return false;
        if (user.ownerId === deviceId) return true; // 球員永遠可操作自己的分身卡片
        if (isMainAdmin) return true; // 主辦人可以操作任何人
        if (isSubAdmin) {
          if (user.ownerId === data.adminId) return false; // 副管不可觸碰主管
          if (subAdminDevices.includes(user.ownerId) && user.ownerId !== deviceId) return false; // 副管不可觸碰其他副管
          return true; // 副管可管理一般球員
        }
        return false;
      };

      const checkIsCoolingDown = (user) => user.unlockTime ? Boolean(user.unlockTime > now) : false;
      const totalUsersCount = allUsers.length;
      const isRoomFull = totalUsersCount >= (maxUsers || 32);

      // ==========================================
      // 成員新增（強制取回碼 / 防同名 / 防同人多建）
      // ==========================================
      const handleAddMember = () => {
        if (isRoomFull) return alert(`房間人數已達 ${maxUsers} 人上限！`);
        const trimmedName = newName.trim();
        if (!trimmedName) return alert("請輸入姓名 / 暱稱！");
        
        // 1. 全場重名檢查 (不分大小寫)
        const isDuplicateName = allUsers.some(u => u.name.trim().toLowerCase() === trimmedName.toLowerCase());
        if (isDuplicateName) {
          return alert(`⚠️ 球局中已經有名稱為【${trimmedName}】的成員！\n請使用不同暱稱（例如：${trimmedName}+1、${trimmedName} B）以避免現場排隊混淆。`);
        }

        // 2. 防同一個人重複建立多個名字 (每台裝置名額限制)
        const deviceLimit = maxCardsPerDevice || 1;
        if (!isAdmin && myCards.length >= deviceLimit) {
          return alert(`⚠️ 您目前已在此球局登記了 ${myCards.length} 位成員（${myCards.map(u => u.name).join('、')}）！\n目前球局設定每位球友上限登記 ${deviceLimit} 位。若需幫朋友報名攜伴，請聯繫現場管理員協助。`);
        }

        const cleanCode = newClaimCode.trim();
        if (!cleanCode) {
          return alert("⚠️【取回碼為必填欄位】\n請輸入取回碼（建議填寫手機末 3 碼，如 588）！\n若日後跳出 LINE 或更換手機，必須憑此碼取回名子控制權。");
        }
        if (cleanCode.length < 3 || cleanCode.length > 6) {
          return alert("⚠️ 取回碼長度請介於 3 到 6 位數字！");
        }
        if (!/^\d{3,6}$/.test(cleanCode)) {
          return alert("⚠️ 取回碼格式不符，請輸入 3~6 位純數字（例：手機末 3 碼 588）！");
        }

        const newUserId = 'u_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
        const claimHash = hashString(roomId + '_' + newUserId + '_' + cleanCode);

        const newUser = { 
          id: newUserId, 
          name: trimmedName, 
          gender: newGender, 
          level: newLevel, 
          customTags: '', 
          unlockTime: 0, 
          ownerId: deviceId,
          claimHash: claimHash,
          hasClaimCode: true
        };

        syncData({ freeUsers: [...freeUsers, newUser] });
        setNewName('');
      };

      // 打開編輯視窗
      const startEditUser = (user) => {
        if (!canOperate(user)) return;
        setEditingUser(user); 
        setEditName(user.name); 
        setEditGender(user.gender); 
        setEditLevel(user.level || ''); 
        setEditCustomTag(user.customTags || '');
        setAdminNewClaimCode('');
      };

      // 儲存編輯
      const saveUserEdit = () => {
        if (!editName.trim()) return alert("成員名稱不能為空！");
        if (isAdmin && adminNewClaimCode.trim()) {
          if (!/^\d{3,6}$/.test(adminNewClaimCode.trim())) {
            return alert("重設取回碼請輸入 3 到 6 位純數字 (例如手機末 3 碼)！");
          }
        }

        const update = (list) => (list || []).map(u => {
          if (u.id !== editingUser.id) return u;
          let updated = { 
            ...u, 
            name: editName.trim(), 
            gender: editGender, 
            level: editLevel, 
            customTags: editCustomTag.trim() 
          };
          if (isAdmin && adminNewClaimCode.trim()) {
            updated.claimHash = hashString(roomId + '_' + u.id + '_' + adminNewClaimCode.trim());
            updated.hasClaimCode = true;
          }
          return updated;
        });

        syncData({ 
          freeUsers: update(freeUsers), 
          courts: courts.map(c => ({ ...c, playing: update(c.playing), waiting: update(c.waiting) })) 
        });
        setEditingUser(null);
      };

      // 管理員移交給我
      const handleTransferToMe = (targetUser) => {
        if (!window.confirm(`確定要將【${targetUser.name}】的歸屬權直接綁定到您這台手機嗎？`)) return;
        const update = (list) => (list || []).map(u => u.id === targetUser.id ? { ...u, ownerId: deviceId } : u);
        syncData({ 
          freeUsers: update(freeUsers), 
          courts: courts.map(c => ({ ...c, playing: update(c.playing), waiting: update(c.waiting) })) 
        });
        setEditingUser(null);
        alert(`已成功將【${targetUser.name}】綁定至目前裝置！`);
      };

      // 管理員解綁
      const handleUnbindOwner = (targetUser) => {
        if (!window.confirm(`確定要解除【${targetUser.name}】的裝置綁定嗎？解除後該卡片將處於無主狀態，可透過取回碼重新認領。`)) return;
        const update = (list) => (list || []).map(u => u.id === targetUser.id ? { ...u, ownerId: '' } : u);
        syncData({ 
          freeUsers: update(freeUsers), 
          courts: courts.map(c => ({ ...c, playing: update(c.playing), waiting: update(c.waiting) })) 
        });
        setEditingUser(null);
        alert(`已解除【${targetUser.name}】的綁定。`);
      };

      // 刪除成員
      const handleDeleteUser = () => {
        if (!window.confirm(`確定要移除成員【${editingUser.name}】嗎？移除後將釋放名額。`)) return;
        const remove = (list) => (list || []).filter(u => u.id !== editingUser.id);
        syncData({ 
          freeUsers: remove(freeUsers), 
          courts: courts.map(c => ({ ...c, playing: remove(c.playing), waiting: remove(c.waiting) })) 
        });
        setEditingUser(null);
      };

      // ==========================================
      // 取回名子 / 認領機制 (Claim via Phone PIN)
      // ==========================================
      const handleOpenClaimModal = (targetUser = null) => {
        if (targetUser) {
          setClaimTargetUserId(targetUser.id);
        } else if (allUsers.length > 0) {
          const firstNotMine = allUsers.find(u => u.ownerId !== deviceId) || allUsers[0];
          setClaimTargetUserId(firstNotMine.id);
        }
        setInputClaimCode('');
        setShowClaimModal(true);
      };

      const handleExecuteClaim = () => {
        const targetUser = allUsers.find(u => u.id === claimTargetUserId);
        if (!targetUser) return alert("請選擇要取回的名字！");
        
        const cleanCode = inputClaimCode.trim();
        if (!cleanCode) return alert("請輸入當初登記的手機末 3 碼 / 取回碼！");

        let isSuccess = false;
        if (targetUser.claimHash) {
          const expectedHash = hashString(roomId + '_' + targetUser.id + '_' + cleanCode);
          if (expectedHash === targetUser.claimHash) isSuccess = true;
        } else {
          return alert(`卡片【${targetUser.name}】建立時未設定取回碼！\n請直接向現場主辦人反映，由主辦人在卡片編輯中一鍵為您「移交歸屬」或「重設取回碼」。`);
        }

        if (isSuccess) {
          const oldOwnerId = targetUser.ownerId;
          const update = (list) => (list || []).map(u => {
            if (u.id === targetUser.id) return { ...u, ownerId: deviceId };
            if (claimWithCompanions && oldOwnerId && u.ownerId === oldOwnerId) return { ...u, ownerId: deviceId };
            return u;
          });

          syncData({ 
            freeUsers: update(freeUsers), 
            courts: courts.map(c => ({ ...c, playing: update(c.playing), waiting: update(c.waiting) })) 
          });

          setShowClaimModal(false);
          alert(`🎉 取回成功！您已重新獲得【${targetUser.name}】的控制權！${claimWithCompanions ? '\n（相關攜伴卡片也已一併同步轉移至此手機）' : ''}`);
        } else {
          alert("❌ 取回碼不正確！\n請確認手機末 3 碼是否與當初建立時一致，或請管理員為您重設。");
        }
      };

      // 管理員救援碼恢復
      const handleAdminRecovery = () => {
        const key = inputAdminRecoveryKey.trim();
        if (!key) return alert("請輸入 6 碼管理員救援碼！");

        const computedHash = hashString(roomId + "_admin_" + key);
        const matchesHash = data.adminRecoveryHash && computedHash === data.adminRecoveryHash;
        const matchesKey = data.adminRecoveryKey && key === data.adminRecoveryKey;

        if (matchesHash || matchesKey) {
          syncData({ adminId: deviceId });
          setShowAdminRecoveryModal(false);
          setInputAdminRecoveryKey('');
          alert("🎉 救援成功！您已重新取得「主管理員」最高管理權限！");
        } else {
          alert("❌ 救援碼錯誤！請確認房主救援碼是否輸入正確。");
        }
      };

      // 產生副管連結
      const handleGenerateSubAdminLink = () => {
        if (currentSubAdminCount >= 2) return alert("副管理員已達 2 位上限！請先清除舊有副管。");
        const subAdminUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?room=' + roomId + '&role=subadmin';
        navigator.clipboard.writeText(subAdminUrl);
        alert("🔗 副管專屬連結已複製！\n請傳送給指定的球友，對方點擊進入即可獲得權限。");
        setShowSettings(false);
      };

      // 撤銷副管
      const handleClearSubAdmins = () => {
        if (!window.confirm("確定要撤銷所有副管理員的權限嗎？")) return;
        syncData({ subAdminDevices: [] });
        setShowSettings(false);
      };

      // 新增場地
      const handleAddCourt = () => {
        if (courts.length >= 4) return alert("場地已達上限 (最高 4 面)！\n若需新增，請先刪除現存場地。");
        syncData({ 
          courts: [...courts, { 
            id: 'court_' + Date.now(), 
            name: `${courts.length + 1} 號場 (球場${String.fromCharCode(65 + courts.length)}) 🏸`, 
            playing: [], 
            waiting: [], 
            isMatchStarted: false 
          }] 
        });
      };

      const handleSaveCourtName = (id) => {
        if (!editCourtName.trim()) return alert("名稱不能為空！");
        syncData({ courts: courts.map(c => c.id === id ? { ...c, name: editCourtName.trim() } : c) });
        setEditingCourtId(null);
      };

      const handleDeleteCourt = (id) => {
        const courtToDelete = courts.find(c => c.id === id);
        let playing = courtToDelete.playing || []; 
        let waiting = courtToDelete.waiting || [];
        if (playing.length > 0 || waiting.length > 0) {
          if (!window.confirm(`【${courtToDelete.name}】上還有成員！確定刪除並將他們移回「自由區」嗎？`)) return;
          syncData({ freeUsers: [...freeUsers, ...playing, ...waiting], courts: courts.filter(c => c.id !== id) });
        } else {
          if (!window.confirm(`確定要刪除【${courtToDelete.name}】嗎？`)) return;
          syncData({ courts: courts.filter(c => c.id !== id) });
        }
        setEditingCourtId(null);
      };

      const toggleMatchLock = (courtId) => {
        syncData({ courts: courts.map(c => c.id === courtId ? { ...c, isMatchStarted: !c.isMatchStarted } : c) });
      };

      const handleUpdateMaxUsers = () => {
        const newMax = prompt(`請輸入新的人數上限 (目前: ${maxUsers}人，最高可設定32人):`, maxUsers);
        if (newMax === null) return;
        const parsed = parseInt(newMax, 10);
        if (isNaN(parsed) || parsed < 1 || parsed > 32) return alert("請輸入 1 到 32 之間的有效數字！");
        if (parsed < totalUsersCount) return alert(`目前房間內已有 ${totalUsersCount} 人，上限不能低於當前人數！`);
        syncData({ maxUsers: parsed });
      };

      const handleClearRoom = () => {
        if (!window.confirm("⚠️ 警告：確定要清空整場球局嗎？\n這將會移除所有場上、排隊區與自由區的成員，並解除所有比賽鎖定！(此動作無法復原)")) return;
        const resetCourts = courts.map(c => ({ ...c, playing: [], waiting: [], isMatchStarted: false }));
        syncData({ freeUsers: [], courts: resetCourts });
      };

      // 移動成員處理
      const processMove = (user, sourceZone, sourceCourtId, targetZone, targetCourtId) => {
        if (checkIsCoolingDown(user) && !isAdmin) return alert("成員尚在休息冷卻中，僅管理員可強制操作！");
        if (sourceCourtId) {
          const sCourt = courts.find(c => c.id === sourceCourtId);
          if (sCourt && sCourt.isMatchStarted && sourceZone === 'playing') return alert("該場地比賽鎖定中，無法將球員移出！");
        }
        if (targetCourtId) {
          const tCourt = courts.find(c => c.id === targetCourtId);
          if (tCourt && tCourt.isMatchStarted && targetZone === 'playing') return alert("該場地比賽鎖定中，無法加入新球員！");
        }
        if (sourceZone === targetZone && sourceCourtId === targetCourtId) return;

        let updatedFree = [...freeUsers];
        let updatedCourts = JSON.parse(JSON.stringify(courts));

        if (sourceZone === 'free') updatedFree = updatedFree.filter(u => u.id !== user.id);
        else if (sourceZone === 'waiting' || sourceZone === 'playing') {
          const sCourt = updatedCourts.find(c => c.id === sourceCourtId);
          sCourt[sourceZone] = (sCourt[sourceZone] || []).filter(u => u.id !== user.id);
        }

        const movedUser = { ...user, unlockTime: 0 };
        if (targetZone === 'free') updatedFree.push(movedUser);
        else if (targetZone === 'waiting' || targetZone === 'playing') {
          const tCourt = updatedCourts.find(c => c.id === targetCourtId);
          if (!tCourt[targetZone]) tCourt[targetZone] = [];
          if (targetZone === 'waiting' && tCourt.waiting.length >= 4) return alert("等待區已滿 (上限 4 人)！");
          tCourt[targetZone].push(movedUser);
        }
        syncData({ freeUsers: updatedFree, courts: updatedCourts });
      };

      const handleZoneClick = (targetZone, targetCourtId = null) => {
        if (!selectedUserId) return;
        let user = freeUsers.find(u => u.id === selectedUserId);
        let sourceZone = 'free', sourceCourtId = null;
        if (!user) { for (let c of courts) { user = (c.waiting || []).find(u => u.id === selectedUserId); if (user) { sourceZone = 'waiting'; sourceCourtId = c.id; break; } } }
        if (!user) { for (let c of courts) { user = (c.playing || []).find(u => u.id === selectedUserId); if (user) { sourceZone = 'playing'; sourceCourtId = c.id; break; } } }
        
        if (user) processMove(user, sourceZone, sourceCourtId, targetZone, targetCourtId);
        setSelectedUserId(null);
      };

      // 下場處理 (含 Debounce 防重複下場)
      const handleFinishGame = (courtId) => {
        if (isFinishingMatchRef.current) return;
        isFinishingMatchRef.current = true;
        setTimeout(() => { isFinishingMatchRef.current = false; }, 1200);

        let updatedCourts = JSON.parse(JSON.stringify(courts));
        let updatedFree = [...freeUsers];
        const court = updatedCourts.find(c => c.id === courtId);
        if (!court.playing || court.playing.length === 0) return;

        const newUnlockTime = (court.isMatchStarted && enableRestRule) ? Date.now() + (restMinutes * 60 * 1000) : 0;
        const finishedPlayers = court.playing.map(u => ({ ...u, unlockTime: newUnlockTime }));
        
        updatedFree = [...updatedFree, ...finishedPlayers];
        court.playing = [...(court.waiting || [])];
        court.waiting = [];
        court.isMatchStarted = false; 

        syncData({ courts: updatedCourts, freeUsers: updatedFree });
      };

      const togglePayment = (userId) => {
        if (!isAdmin) return;
        const update = (list) => (list || []).map(u => u.id === userId ? { ...u, customTags: u.customTags === '💰' ? '' : '💰' } : u);
        syncData({ freeUsers: update(freeUsers), courts: courts.map(c => ({ ...c, playing: update(c.playing), waiting: update(c.waiting) })) });
      };

      // 渲染球員卡片
      const renderUserCard = (user, sourceZone, courtId) => {
        const isMainAdminCard = user.ownerId === data.adminId && (allUsers.filter(u => u.ownerId === data.adminId)[0]?.id === user.id);
        const isSubAdminCard = subAdminDevices.includes(user.ownerId) && (allUsers.filter(u => u.ownerId === user.ownerId)[0]?.id === user.id);

        const isCoolingDown = checkIsCoolingDown(user);
        const court = courtId ? courts.find(c => c.id === courtId) : null;
        const isCourtLocked = court && court.isMatchStarted && sourceZone === 'playing';
        
        const operable = canOperate(user);
        const canMoveCard = operable && (!adminOnlyDrag || isAdmin) && !isCourtLocked;

        let timeString = '';
        if (isCoolingDown) {
          const remainingMs = user.unlockTime - now;
          const mins = Math.floor(remainingMs / 60000);
          const secs = Math.floor((remainingMs % 60000) / 1000);
          timeString = `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        return (
          <UserCard 
            key={user.id} 
            user={user} 
            isCoolingDown={isCoolingDown} 
            timeString={timeString} 
            isSelected={selectedUserId === user.id} 
            canMoveCard={canMoveCard} 
            operable={operable} 
            isMine={user.ownerId === deviceId} 
            isUserMainAdmin={isMainAdminCard} 
            isUserSubAdmin={isSubAdminCard}   
            isAdmin={isAdmin} 
            onSelect={setSelectedUserId} 
            onEdit={startEditUser} 
            onTogglePayment={togglePayment} 
            onRequestClaim={handleOpenClaimModal}
          />
        );
      };

      // 自由區排序：本人的卡片置頂
      const sortedFreeUsers = [...freeUsers].sort((a, b) => {
         const aIsMine = a.ownerId === deviceId ? 1 : 0;
         const bIsMine = b.ownerId === deviceId ? 1 : 0;
         return bIsMine - aIsMine;
      });

      const currentUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?room=' + roomId;
      const qrCodeUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(currentUrl)}`;

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans flex flex-col relative pb-10">
          
          {/* 離線警告橫幅 */}
          {!isOnline && (
            <div className="bg-red-600 text-white text-xs sm:text-sm p-2.5 font-bold flex justify-center items-center z-50 sticky top-0 shadow-lg">
              <span className="animate-pulse mr-2 text-base">⚠️</span>
              <span>羽球館訊號較弱，網路連線中斷！系統正在嘗試重新連線，請暫停操作以免不同步...</span>
            </div>
          )}

          {showBrowserWarning && (
            <div className="bg-emerald-950/90 backdrop-blur-md text-emerald-200 text-xs sm:text-sm p-3 font-semibold flex justify-between items-center z-40 shadow border-b border-emerald-500/30 sticky top-0">
              <span className="flex-1">🏸 貼心提示：建議點選右上角「以 Safari/Chrome 瀏覽器開啟」，若切換跳出 LINE 亦可隨時用「手機末 3 碼取回名子」！</span>
              <button 
                onClick={() => { setShowBrowserWarning(false); localStorage.setItem('shuttleflow_browser_warned', 'true'); }} 
                className="ml-3 bg-emerald-800 hover:bg-emerald-700 px-2.5 py-1 rounded-lg text-white transition active:scale-95 text-xs font-bold"
              >
                ✕ 知道了
              </button>
            </div>
          )}

          {/* 移動卡片浮動提示 */}
          {selectedUserId && (

                      </div>
                    ) : (!isAdmin && myCards.length >= (maxCardsPerDevice || 1)) ? (
                      <div className="text-center py-4 px-3 bg-emerald-950/80 border border-emerald-500/40 rounded-xl text-xs text-emerald-200 shadow">
                        <div className="text-2xl mb-1">🏸</div>
                        <div className="font-bold text-sm mb-1 text-emerald-300">您已成功報名本球局！</div>
                        <div className="text-slate-300 mb-2">名下球員：<span className="font-black text-yellow-300 bg-slate-900 px-2 py-0.5 rounded border border-yellow-500/40">{myCards.map(u => u.name).join('、')}</span></div>
                        <p className="text-[11px] text-slate-400">本球局設定每位球友限報名 {maxCardsPerDevice || 1} 位。<br/>如需幫朋友攜伴報名，請請現場主辦人協助！</p>
                      </div>
                    ) : (
                      <>
                        <input 
                          type="text" 
                          placeholder="請輸入姓名 / 暱稱" 
                          value={newName} 
                          onChange={e => setNewName(e.target.value)} 
                          className="w-full px-3 py-2 border border-slate-700 rounded-xl text-sm mb-2 bg-slate-900 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium" 
                        />
                        
                        <div className="flex gap-2 mb-2">
                          <select 
                            value={newGender} 
                            onChange={e => setNewGender(e.target.value)} 
                            className="flex-1 px-2.5 py-1.5 border border-slate-700 rounded-xl text-xs bg-slate-900 text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 font-bold"
                          >
                            <option value="blue">男</option>
                            <option value="red">女</option>
                          </select>
                          
                          <select 
                            value={newLevel} 
                            onChange={e => setNewLevel(e.target.value)} 
                            className="flex-1 px-2.5 py-1.5 border border-slate-700 rounded-xl text-xs bg-slate-900 text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                          >
                            <option value="">強度不顯示</option>
                            <option value="高階">🏸 高階</option>
                            <option value="中階">🏸 中階</option>
                            <option value="初階">🏸 初階</option>
                            <option value="新手">🏸 新手</option>
                          </select>
                        </div>

                        {/* 取回碼 (手機末3碼) - 強制必填 */}
                        <div className="mb-3">
                          <label className="block text-xs font-bold text-emerald-300 mb-1 flex items-center justify-between">
                            <span>📱 取回碼 (必填，建議手機末3碼)</span>
                            <span className="text-rose-400 font-bold text-xs">* 必填純數字</span>
                          </label>
                          <input 
                            type="text" 
                            inputMode="numeric"
                            pattern="[0-9]*"
                            placeholder="輸入手機末 3~6 碼 (如 588)" 
                            value={newClaimCode} 
                            maxLength={6}
                            onChange={e => setNewClaimCode(e.target.value.replace(/\D/g, ''))} 
                            className="w-full px-3 py-2 border-2 border-emerald-500/70 rounded-xl text-sm font-mono tracking-widest bg-slate-900 text-yellow-300 focus:outline-none focus:ring-2 focus:ring-yellow-400 font-bold placeholder-slate-600" 
                          />
                          <p className="text-[11px] text-slate-400 font-medium mt-1">
                            🔒 換手機或跳出 LINE 時，憑此碼隨時取回自己名字。
                          </p>
                        </div>

                        <button 
                          onClick={handleAddMember} 
                          className="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white py-2.5 rounded-xl font-black text-sm active:scale-95 shadow-lg transition flex items-center justify-center gap-1.5"
                        >
                          <span>🏸 確定加入排隊</span>
                        </button>
                      </>
                    )}
                  </div>
                ) : null}
              </div>
            </section>
          </main>

          {/* 編輯球員彈窗 */}
          {editingUser ? (
             <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
               <div className="bg-slate-900 p-6 rounded-3xl shadow-2xl w-full max-w-sm border border-emerald-500/40 text-slate-100">
                 <h2 className="font-black text-lg mb-3 text-emerald-300 border-b border-slate-800 pb-2 flex justify-between items-center">
                   <span>🏸 編輯球員：{editingUser.name}</span>
                   {editingUser.ownerId === deviceId && <span className="text-xs bg-emerald-950 text-emerald-300 border border-emerald-600/50 px-2 py-0.5 rounded-full font-bold">本人卡片</span>}
                 </h2>

                 <label className="block text-xs font-bold text-slate-300 mb-1">球員名稱</label>
                 <input 
                   className="w-full border border-slate-700 bg-slate-950 p-2 mb-2.5 rounded-xl focus:ring-2 focus:ring-emerald-400 outline-none text-sm text-white font-medium" 
                   value={editName} 
                   onChange={e => setEditName(e.target.value)} 
                   autoFocus
                 />

                 <div className="flex gap-2 mb-3">
                   <div className="flex-1">
                     <label className="block text-xs font-bold text-slate-300 mb-1">性別</label>
                     <select 
                       className="w-full border border-slate-700 bg-slate-950 p-2 rounded-xl text-xs focus:ring-2 focus:ring-emerald-400 outline-none text-white font-bold" 
                       value={editGender} 
                       onChange={e => setEditGender(e.target.value)}
                     >
                       <option value="blue">男</option>
                       <option value="red">女</option>
                     </select>
                   </div>
                   <div className="flex-1">
                     <label className="block text-xs font-bold text-slate-300 mb-1">強度等級</label>
                     <select 
                       className="w-full border border-slate-700 bg-slate-950 p-2 rounded-xl text-xs focus:ring-2 focus:ring-emerald-400 outline-none text-white" 
                       value={editLevel} 
                       onChange={e => setEditLevel(e.target.value)}
                     >
                       <option value="">無</option>
                       <option value="高階">🏸 高階</option>
                       <option value="中階">🏸 中階</option>
                       <option value="初階">🏸 初階</option>
                       <option value="新手">🏸 新手</option>
                     </select>
                   </div>
                 </div>
                 
                 {isAdmin ? (
                   <div className="mb-3 bg-purple-950/40 p-2.5 rounded-xl border border-purple-500/40">
                     <label className="block text-xs font-bold text-purple-300 mb-1">自定義標籤 (限 5 字，如: 季繳/早退)</label>
                     <input 
                       className="w-full border border-purple-500/50 bg-slate-950 p-1.5 rounded-lg text-sm focus:ring-2 focus:ring-purple-400 outline-none text-white" 
                       maxLength={5} 
                       placeholder="如: 季繳/早退" 
                       value={editCustomTag} 
                       onChange={e => setEditCustomTag(e.target.value)} 
                     />
                   </div>
                 ) : null}

                 {/* 管理員救援區 */}
                 {isAdmin && (
                   <div className="mb-4 bg-slate-950 p-3 rounded-2xl border border-slate-800 text-xs">
                     <div className="font-bold text-emerald-400 mb-1.5 flex items-center justify-between">
                       <span>🛠️ 管理員現場救援</span>
                       <span className="text-[10px] text-slate-500 font-mono">
                         {editingUser.ownerId ? ('綁定: ' + editingUser.ownerId.slice(0, 10) + '...') : '未綁定'}
                       </span>
                     </div>
                     <div className="flex gap-2 mb-2">
                       <button 
                         type="button" 
                         onClick={() => handleTransferToMe(editingUser)} 
                         className="flex-1 bg-teal-900/60 hover:bg-teal-800 text-teal-300 font-bold py-1.5 rounded-xl border border-teal-500/40 transition active:scale-95"
                       >
                         🔄 綁定給我
                       </button>
                       <button 
                         type="button" 
                         onClick={() => handleUnbindOwner(editingUser)} 
                         className="flex-1 bg-amber-950/60 hover:bg-amber-900 text-amber-300 font-bold py-1.5 rounded-xl border border-amber-500/40 transition active:scale-95"
                       >
                         🔓 解除綁定
                       </button>
                     </div>
                     <div>
                       <input 
                         type="text" 
                         inputMode="numeric"
                         pattern="[0-9]*"
                         placeholder="幫球員重設手機末 3~6 碼純數字" 
                         value={adminNewClaimCode} 
                         maxLength={6} 
                         onChange={e => setAdminNewClaimCode(e.target.value.replace(/\D/g, ''))} 
                         className="w-full border border-slate-700 bg-slate-900 p-2 rounded-xl text-xs text-yellow-300 font-mono tracking-wider" 
                       />
                     </div>
                   </div>
                 )}
                 
                 <div className="flex gap-2">
                   <button className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-xl font-bold active:scale-95 shadow transition" onClick={saveUserEdit}>儲存</button>
                   <button className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 rounded-xl font-bold active:scale-95 transition" onClick={() => setEditingUser(null)}>取消</button>
                 </div>
                 <button className="w-full mt-3 bg-rose-950/40 border border-rose-500/40 text-rose-300 py-1.5 rounded-xl font-bold active:scale-95 hover:bg-rose-900/60 transition text-xs" onClick={handleDeleteUser}>
                   🗑️ 刪除此球員
                 </button>
               </div>
             </div>
           ) : null}

          {/* 取回名子 / 認領名子彈窗 (ClaimModal) */}
          {showClaimModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 p-6 rounded-3xl shadow-2xl max-w-sm w-full border border-emerald-500/40 relative text-slate-100">
                <button 
                  className="absolute top-4 right-4 text-slate-400 hover:text-white text-xl font-bold" 
                  onClick={() => setShowClaimModal(false)}
                >
                  ✕
                </button>
                <div className="flex items-center gap-2 mb-2">
                  <span className="text-2xl animate-shuttle">🏸</span>
                  <h2 className="text-lg font-black text-emerald-300">取回名子 / 認領名子</h2>
                </div>
                <p className="text-slate-400 text-xs mb-4">
                  若跳出 LINE 或更換手機導致卡片無法移動，請選擇您的名字並輸入登記的「手機末 3 碼」即可秒取回！
                </p>

                <label className="block text-xs font-bold text-slate-300 mb-1">1. 請選擇您要認領的名字：</label>
                <select 
                  value={claimTargetUserId} 
                  onChange={e => setClaimTargetUserId(e.target.value)} 
                  className="w-full border border-slate-700 bg-slate-950 p-2.5 rounded-xl text-sm mb-3 text-white focus:ring-2 focus:ring-emerald-400 outline-none"
                >
                  {allUsers.map(u => (
                    <option key={u.id} value={u.id}>
                      {u.name} {u.ownerId === deviceId ? '（目前已是我的）' : ''} {u.hasClaimCode ? '🔑' : '（未設密碼）'}
                    </option>
                  ))}
                </select>

                <label className="block text-xs font-bold text-slate-300 mb-1">2. 請輸入取回碼 (手機末 3 碼)：</label>
                <input 
                  type="text" 
                  inputMode="numeric"
                  pattern="[0-9]*"
                  placeholder="輸入 3~6 碼純數字 (如 588)" 
                  value={inputClaimCode} 
                  maxLength={6} 
                  onChange={e => setInputClaimCode(e.target.value.replace(/\D/g, ''))} 
                  className="w-full border-2 border-emerald-500 bg-slate-950 p-2.5 rounded-xl text-lg font-mono tracking-widest text-center mb-3 text-yellow-300 focus:ring-2 focus:ring-yellow-400 outline-none font-bold" 
                  autoFocus
                />

                <label className="flex items-center gap-2 text-xs text-slate-300 font-medium cursor-pointer mb-4">
                  <input 
                    type="checkbox" 
                    checked={claimWithCompanions} 
                    onChange={e => setClaimWithCompanions(e.target.checked)} 
                    className="w-4 h-4 accent-emerald-500" 
                  />
                  連同我當初一起建立的朋友/攜伴卡片一併轉移
                </label>

                <div className="flex gap-2">
                  <button 
                    onClick={handleExecuteClaim} 
                    className="flex-1 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white py-2.5 rounded-xl font-black text-sm shadow active:scale-95 transition"
                  >
                    驗證並取回
                  </button>
                  <button 
                    onClick={() => setShowClaimModal(false)} 
                    className="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2.5 rounded-xl font-bold text-sm active:scale-95 transition"
                  >
                    取消
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 房主救援彈窗 (AdminRecoveryModal) */}
          {showAdminRecoveryModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 p-6 rounded-3xl shadow-2xl max-w-sm w-full border border-amber-500/50 relative text-slate-100">
                <button 
                  className="absolute top-4 right-4 text-slate-400 hover:text-white text-xl font-bold" 
                  onClick={() => setShowAdminRecoveryModal(false)}
                >
                  ✕
                </button>
                <div className="flex items-center gap-2 mb-2">
                  <span className="text-2xl">👑</span>
                  <h2 className="text-lg font-black text-amber-300">主管理員身份救援</h2>
                </div>
                <p className="text-slate-400 text-xs mb-4">
                  如果您是本羽球局的創辦人/主辦人，但因跳出 LINE 失去了主管理員權限，請輸入建房時產生的 6 碼救援碼。
                </p>

                <label className="block text-xs font-bold text-slate-300 mb-1">請輸入 6 碼管理員救援碼：</label>
                <input 
                  type="text" 
                  placeholder="6 碼數字 (如: 839210)" 
                  value={inputAdminRecoveryKey} 
                  maxLength={10} 
                  onChange={e => setInputAdminRecoveryKey(e.target.value.trim())} 
                  className="w-full border-2 border-amber-500 bg-slate-950 p-2.5 rounded-xl text-lg font-mono tracking-widest text-center mb-4 text-yellow-300 focus:ring-2 focus:ring-amber-400 outline-none font-bold" 
                  autoFocus
                />

                <div className="flex gap-2">
                  <button 
                    onClick={handleAdminRecovery} 
                    className="flex-1 bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-950 py-2.5 rounded-xl font-black text-sm shadow active:scale-95 transition"
                  >
                    驗證奪回房主
                  </button>
                  <button 
                    onClick={() => setShowAdminRecoveryModal(false)} 
                    className="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2.5 rounded-xl font-bold text-sm active:scale-95 transition"
                  >
                    取消
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 頁尾作者標記 */}
          <footer className="mt-8 text-center text-xs font-mono text-slate-500 space-y-1">
            <p>羽樂排 ShuttleJoy v1.0 • 由 <span className="text-emerald-400 font-bold">[羽球狂熱份子]</span> 打造</p>
          </footer>

        </div>
      );
    }

    // ==========================================
    // 路由控制器 (AppRouter)
    // ==========================================
    function AppRouter() {
      const urlParams = new URLSearchParams(window.location.search);
      const initialRoom = urlParams.get('room');
      const [currentRoom, setCurrentRoom] = useState(initialRoom);
      const [initRoomName, setInitRoomName] = useState('');
      const [initMaxUsers, setInitMaxUsers] = useState(32);
      const [isCreatingNew, setIsCreatingNew] = useState(false);

      const handleCreateRoom = (roomId, name, max) => {
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?room=' + roomId;
        window.history.pushState({path:newUrl}, '', newUrl);
        setInitRoomName(name);
        setInitMaxUsers(max);
        setIsCreatingNew(true);
        setCurrentRoom(roomId);
      };

      const handleJoinRoom = (roomId) => {
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?room=' + roomId;
        window.history.pushState({path:newUrl}, '', newUrl);
        setIsCreatingNew(false);
        setCurrentRoom(roomId);
      };

      const handleLeaveRoom = () => {
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
        window.history.pushState({path:newUrl}, '', newUrl);
        setIsCreatingNew(false);
        setCurrentRoom(null);
      };

      if (currentRoom) {
        return (
          <ShuttleFlowRoom 
            roomId={currentRoom} 
            initRoomName={initRoomName} 
            initMaxUsers={initMaxUsers} 
            isCreatingNew={isCreatingNew} 
            onLeave={handleLeaveRoom} 
          />
        );
      }
      return <LandingPage onJoinRoom={handleJoinRoom} onCreateRoom={handleCreateRoom} />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AppRouter />);
  </script>
</body>
</html>
