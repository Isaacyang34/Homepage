<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAVAS ESP32 數據採集控制箱 - 3D 工業配線與 SD/Jumper 模組模型</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --bg-dark: #070a12;
            --panel-bg: rgba(13, 19, 33, 0.88);
            --panel-border: rgba(56, 189, 248, 0.25);
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.4);
            --accent: #10b981;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .ui-header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 18px 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .ui-header h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ui-header p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .ui-nav {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            gap: 12px;
        }

        .btn {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .btn-primary {
            background: var(--primary);
            color: #0f172a;
            border: none;
        }

        .btn-primary:hover {
            background: #7dd3fc;
            color: #0f172a;
        }

        .ui-controls {
            position: absolute;
            bottom: 25px;
            left: 20px;
            z-index: 10;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 20px 24px;
            width: 380px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .control-group {
            margin-bottom: 16px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        .control-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .control-value {
            color: var(--primary);
            font-family: 'JetBrains Mono', monospace;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            background: #1e293b;
            border-radius: 3px;
            outline: none;
            accent-color: var(--primary);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 14px;
        }

        .camera-presets {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 10px;
        }

        .btn-sm {
            padding: 6px 10px;
            font-size: 11px;
            justify-content: center;
        }

        .part-card {
            position: absolute;
            top: 90px;
            right: 20px;
            z-index: 10;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--primary);
            border-radius: 14px;
            padding: 22px;
            width: 340px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 20px var(--primary-glow);
            transform: translateX(400px);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .part-card.active {
            transform: translateX(0);
        }

        .part-card h3 {
            font-size: 17px;
            color: var(--primary);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .part-card .tag {
            font-size: 11px;
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--primary-glow);
        }

        .part-card p {
            font-size: 12.5px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 14px;
        }

        .part-spec {
            background: rgba(15, 23, 42, 0.7);
            border-radius: 8px;
            padding: 12px;
            font-size: 12px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .spec-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .spec-item:last-child {
            margin-bottom: 0;
        }

        .spec-item span:first-child {
            color: var(--text-muted);
        }

        .spec-item span:last-child {
            color: var(--text-main);
            font-weight: 600;
        }

        #loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(56, 189, 248, 0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #loader p {
            margin-top: 16px;
            font-size: 14px;
            color: var(--primary);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <p>載入包含 SD 卡與 Jumper 開關 3D 控制箱模型...</p>
    </div>

    <div class="ui-header">
        <h1><i class="fa-solid fa-cube"></i> KAVAS ESP32 全硬體 3D 工業模型</h1>
        <p>包含 3 路 MAX485、明緯電供、DHT11、Micro-SD 選配模組與 Jumper 開關</p>
    </div>

    <div class="ui-nav">
        <a href="index.html" class="btn"><i class="fa-solid fa-chart-line"></i> 返回即時儀表板</a>
        <a href="BOM_List.md" target="_blank" class="btn btn-primary"><i class="fa-solid fa-file-lines"></i> 開啟 BOM 採購清單</a>
    </div>

    <div class="ui-controls">
        <div class="control-group">
            <div class="control-label">
                <span><i class="fa-solid fa-expand"></i> 爆炸分解圖拆解度</span>
                <span class="control-value" id="explode-val">0%</span>
            </div>
            <input type="range" id="explode-slider" min="0" max="100" value="0">
        </div>

        <div class="control-group">
            <div class="control-label">
                <span><i class="fa-solid fa-eye"></i> 外殼透光隱藏度</span>
                <span class="control-value" id="opacity-val">35%</span>
            </div>
            <input type="range" id="opacity-slider" min="0" max="100" value="35">
        </div>

        <div class="control-label" style="margin-top: 12px; margin-bottom: 4px;">
            <span><i class="fa-solid fa-video"></i> 精細視角特寫 Focus</span>
        </div>
        <div class="camera-presets">
            <button class="btn btn-sm" onclick="focusComponent('esp32')">ESP32主板</button>
            <button class="btn btn-sm" onclick="focusComponent('max485_1')">3路MAX485</button>
            <button class="btn btn-sm" onclick="focusComponent('powerModule')">明緯AC電供</button>
            <button class="btn btn-sm" onclick="focusComponent('sdModule')">SD與Jumper</button>
            <button class="btn btn-sm" onclick="focusComponent('dht11')">DHT11傳感器</button>
            <button class="btn btn-sm" onclick="focusComponent('full')">全景特寫</button>
        </div>

        <div class="btn-grid">
            <button class="btn" id="btn-reset"><i class="fa-solid fa-rotate-left"></i> 重置全覽視角</button>
            <button class="btn" id="btn-animate"><i class="fa-solid fa-play"></i> 自動展示旋轉</button>
        </div>
    </div>

    <div class="part-card" id="part-card">
        <h3 id="card-title">元件名稱 <span class="tag" id="card-tag">TAG</span></h3>
        <p id="card-desc">請點擊 3D 模型中的任何實體元件以查看技術規格與採購連結。</p>
        <div class="part-spec">
            <div class="spec-item"><span>工作電壓：</span><span id="spec-voltage">--</span></div>
            <div class="spec-item"><span>專案用途：</span><span id="spec-usage">--</span></div>
            <div class="spec-item"><span>預估單價：</span><span id="spec-price">--</span></div>
        </div>
        <a href="#" target="_blank" id="card-link" class="btn btn-primary" style="justify-content: center; width: 100%;">
            <i class="fa-solid fa-cart-shopping"></i> 前往廣華電子商城採購
        </a>
    </div>

    <div id="canvas-container"></div>

    <script>
        // -------------------------------------------------------------
        // 1. Three.js 高畫質渲染初始化
        // -------------------------------------------------------------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x070a12);
        scene.fog = new THREE.FogExp2(0x070a12, 0.012);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(22, 18, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 光源
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0x38bdf8, 1.5);
        mainLight.position.set(25, 45, 25);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x10b981, 0.6);
        fillLight.position.set(-20, 20, -20);
        scene.add(fillLight);

        const gridHelper = new THREE.GridHelper(60, 60, 0x38bdf8, 0x1e293b);
        gridHelper.position.y = -6;
        scene.add(gridHelper);

        // -------------------------------------------------------------
        // 2. 擬真 3D 材質與元件資料庫
        // -------------------------------------------------------------
        const mainGroup = new THREE.Group();
        scene.add(mainGroup);
        const components = [];

        const matBoxBase = new THREE.MeshStandardMaterial({ color: 0x273549, roughness: 0.4, metalness: 0.1 });
        const matCoverTransparent = new THREE.MeshPhysicalMaterial({
            color: 0xc8d6e5, transparent: true, opacity: 0.35, roughness: 0.15, transmission: 0.7, thickness: 1.5
        });
        const matRubberGasket = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.9 });
        const matPcbGreen = new THREE.MeshStandardMaterial({ color: 0x047857, roughness: 0.2, metalness: 0.1 });
        const matPcbBlue = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.2, metalness: 0.1 });
        const matPcbBlack = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.2, metalness: 0.1 });
        const matMetalShield = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.9, roughness: 0.2 });
        const matBrass = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.85, roughness: 0.2 });
        const matScrewMetal = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.9, roughness: 0.3 });
        const matPowerCase = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3 });
        const matDhtBlue = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.4 });
        const matTerminalGreen = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.4 });
        const matPinMetal = new THREE.MeshStandardMaterial({ color: 0xfbbf24, metalness: 0.9, roughness: 0.1 });
        const matJumperBlack = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.5 });

        const matWireRed = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3 });
        const matWireWhite = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.3 });
        const matWireCyan = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.3 });
        const matWireYellow = new THREE.MeshStandardMaterial({ color: 0xeab308, roughness: 0.3 });

        const partData = {
            caseCover: {
                name: 'IP68 防水盒高透光上蓋',
                tag: '工規外殼',
                desc: '防爆 PC 高透光材質，4 角設有金屬防脫螺絲固定孔，內嵌黑色防水橡膠矽膠圈。',
                voltage: '不適用', usage: '完全阻隔機房高濕水氣、油霧與粉塵', price: '約 $150 ~ $320',
                link: 'https://shop.cpu.com.tw/cPath/2112'
            },
            caseBase: {
                name: 'IP65/IP68 萬用工程底座',
                tag: '工規外殼',
                desc: '左側設有 PG7 AC110V/220V 電源線防水穿線口；右側設有 3 個 PG9 RS485 電纜穿線口。',
                voltage: '不適用', usage: '固定內部元件與 4 埠防水出線防護', price: '隨外殼附贈',
                link: 'https://shop.cpu.com.tw/cPath/2112'
            },
            esp32: {
                name: 'ESP32 雙核 Wi-Fi 開發板 (DevKit)',
                tag: '主控 MCU',
                desc: '金屬 ESP-WROOM-32 屏蔽蓋、30Pin 排針，GPIO 15 旁邊設有 Jumper 跳線開關用來控制 SD 卡離線日誌啟用。',
                voltage: 'DC 5V (從明緯電源 DC-OUT 接引)', usage: '全系統 3 通道邏輯主控與雲端連線', price: '約 $180 ~ $350',
                link: 'https://shop.cpu.com.tw/Search/advanced/4553503332/page/1/'
            },
            powerModule: {
                name: '明緯 IRM-05-05 降壓電源模組',
                tag: 'AC/DC 電源',
                desc: '明緯 5W 降壓電供，左側紅/白線上入 AC 110V/220V 市電，右側輸出 DC 5V 1A 給 ESP32 與 3 塊 MAX485 供電。',
                voltage: 'AC 110/220V 輸入 $\\rightarrow$ DC 5V 1A 輸出', usage: '接引現場 AC 市電為全控制箱供電', price: '約 $120 ~ $180',
                link: 'https://shop.cpu.com.tw/Search/advanced/49524d2d30352d3035/page/1/'
            },
            max485_1: {
                name: 'ZY-MAX485 通訊模組 (鼓風機 1 號通道)',
                tag: 'RS485 CH1',
                desc: '第一塊 MAX485 模組，綠色端子台引出 1 號雙絞屏蔽電纜，穿過 PG9 防水頭連向 1 號鼓風機。',
                voltage: 'DC 5V', usage: '獨立採集 1 號鼓風機轉速(0~24000RPM)/頻率/電壓', price: '約 $30 ~ $89',
                link: 'https://shop.cpu.com.tw/Search/advanced/4d4158343835/page/1/'
            },
            sdModule: {
                name: '【選配】Micro-SD 卡模組 + Jumper 跳線帽',
                tag: '離線儲存選配',
                desc: 'SPI 介面離線大容量讀卡模組。配合 Jumper 跳線帽(GPIO 15)短路可硬體強制啟用 SD 日誌寫入，撥除即切回標準模式。',
                voltage: 'DC 5V (SPI 介面)', usage: '長週期斷網日誌與故障黑盒子連續儲存', price: '約 $80 ~ $150 /套',
                link: 'https://shop.cpu.com.tw/Search/advanced/534420e6a8a1e7b584/page/1/'
            },
            dht11: {
                name: 'DHT11 數字溫溼度傳感器模組',
                tag: '環境感測',
                desc: '經典藍色柵欄外殼，單總線 3P 杜邦線連接至 ESP32 GPIO4 腳位。',
                voltage: 'DC 3.3V ~ 5.5V', usage: '監測控制箱周圍環境溫濕度', price: '約 $40 ~ $70',
                link: 'https://shop.cpu.com.tw/Search/advanced/4448543131/page/1/'
            },
            cableGland: {
                name: 'PG7 / PG9 電纜防水固定接頭',
                tag: '防水出線頭',
                desc: '左側 1 個 PG7 (鎖緊 AC 110/220V 電源線)；右側 3 個 PG9 (分別鎖緊 3 條 RS485 雙絞電纜)。',
                voltage: '不適用', usage: '4 埠完全防水出線與防拉扯保護', price: '約 $15 ~ $30 /個',
                link: 'https://shop.cpu.com.tw/Search/advanced/504737/page/1/'
            }
        };

        // -------------------------------------------------------------
        // A. IP68 防水外殼底座 & 密封防水圈
        // -------------------------------------------------------------
        const caseBaseMesh = new THREE.Mesh(new THREE.BoxGeometry(18, 4.5, 14), matBoxBase);
        caseBaseMesh.position.y = -2.25;
        caseBaseMesh.castShadow = true;
        caseBaseMesh.receiveShadow = true;
        caseBaseMesh.userData = { partKey: 'caseBase', defaultY: -2.25, explodeFactor: { x: 0, y: -4, z: 0 }, focusPos: new THREE.Vector3(0, 0, 0) };
        mainGroup.add(caseBaseMesh);
        components.push(caseBaseMesh);

        // 防水黑色矽膠圈
        const gasket = new THREE.Mesh(new THREE.BoxGeometry(17.5, 0.4, 13.5), matRubberGasket);
        gasket.position.y = 0.1;
        gasket.userData = { partKey: 'caseBase', defaultY: 0.1, explodeFactor: { x: 0, y: 0.5, z: 0 } };
        mainGroup.add(gasket);

        // -------------------------------------------------------------
        // B. IP68 防水外殼高透光上蓋
        // -------------------------------------------------------------
        const caseCoverMesh = new THREE.Mesh(new THREE.BoxGeometry(18.2, 2.8, 14.2), matCoverTransparent);
        caseCoverMesh.position.y = 3.8;
        caseCoverMesh.userData = { partKey: 'caseCover', defaultY: 3.8, explodeFactor: { x: 0, y: 9, z: 0 }, focusPos: new THREE.Vector3(0, 5, 0) };
        mainGroup.add(caseCoverMesh);
        components.push(caseCoverMesh);

        // -------------------------------------------------------------
        // C. PCB 萬用底板 & M3 金色銅柱
        // -------------------------------------------------------------
        const pcbMesh = new THREE.Mesh(new THREE.BoxGeometry(16, 0.3, 12), matPcbGreen);
        pcbMesh.position.y = 0.3;
        pcbMesh.castShadow = true;
        pcbMesh.receiveShadow = true;
        pcbMesh.userData = { partKey: 'caseBase', defaultY: 0.3, explodeFactor: { x: 0, y: 0, z: 0 } };
        mainGroup.add(pcbMesh);

        // -------------------------------------------------------------
        // D. 明緯 IRM-05-05 電源模組 (靠左側)
        // -------------------------------------------------------------
        const powerGroup = new THREE.Group();
        const powerBody = new THREE.Mesh(new THREE.BoxGeometry(4.2, 2.2, 3.2), matPowerCase);
        powerBody.castShadow = true;
        powerGroup.add(powerBody);

        const matLabel = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
        const labelMesh = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 1.8), matLabel);
        labelMesh.rotation.x = -Math.PI / 2;
        labelMesh.position.set(0, 1.11, 0);
        powerGroup.add(labelMesh);

        powerGroup.position.set(-5, 1.5, -3.5);
        powerGroup.userData = { partKey: 'powerModule', defaultY: 1.5, explodeFactor: { x: -4, y: 4, z: -3 }, focusPos: new THREE.Vector3(-5, 3, -3.5) };
        mainGroup.add(powerGroup);
        components.push(powerGroup);

        // -------------------------------------------------------------
        // E. ESP32 主控板 & Jumper 跳線帽實體 3D 模型
        // -------------------------------------------------------------
        const espGroup = new THREE.Group();
        const espPcb = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.2, 6.2), matPcbBlack);
        espPcb.castShadow = true;
        espGroup.add(espPcb);

        const espShield = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.4, 2.8), matMetalShield);
        espShield.position.set(0, 0.3, 0.8);
        espGroup.add(espShield);

        // Jumper 跳線帽實體 (GPIO 15 旁邊)
        const jumperCap = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.6, 0.5), matJumperBlack);
        jumperCap.position.set(-1.4, 0.4, 2.2);
        espGroup.add(jumperCap);

        espGroup.position.set(-0.5, 0.8, -0.5);
        espGroup.userData = { partKey: 'esp32', defaultY: 0.8, explodeFactor: { x: 0, y: 3.5, z: 0 }, focusPos: new THREE.Vector3(-0.5, 2.5, -0.5) };
        mainGroup.add(espGroup);
        components.push(espGroup);

        // -------------------------------------------------------------
        // F. 3 塊獨立 MAX485 通訊模組 (靠右側)
        // -------------------------------------------------------------
        const createMaxModule = (keyName, zOffset) => {
            const maxGroup = new THREE.Group();
            const maxBoard = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.2, 2.4), matPcbGreen);
            maxBoard.castShadow = true;
            maxGroup.add(maxBoard);

            const termBlock = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.1, 1.8), matTerminalGreen);
            termBlock.position.set(0.9, 0.65, 0);
            maxGroup.add(termBlock);

            maxGroup.position.set(4.8, 0.8, zOffset);
            maxGroup.userData = { partKey: keyName, defaultY: 0.8, explodeFactor: { x: 4.5, y: 3.5, z: zOffset * 0.8 }, focusPos: new THREE.Vector3(4.8, 2.5, zOffset) };
            mainGroup.add(maxGroup);
            components.push(maxGroup);
            return maxGroup;
        };

        createMaxModule('max485_1', -3.8);
        createMaxModule('max485_1', 0);
        createMaxModule('max485_1', 3.8);

        // -------------------------------------------------------------
        // G. 【選配】Micro-SD 卡 SPI 介面模組 3D 模型
        // -------------------------------------------------------------
        const sdGroup = new THREE.Group();
        const sdBoard = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.2, 3.2), matPcbBlue);
        sdBoard.castShadow = true;
        sdGroup.add(sdBoard);

        // 金屬 TF 讀卡插槽
        const tfSlot = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.3, 1.6), matMetalShield);
        tfSlot.position.set(-0.2, 0.25, -0.4);
        sdGroup.add(tfSlot);

        // 插入的黑色 Micro-SD 記憶卡
        const sdCardMesh = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.1, 1.4), matPowerCase);
        sdCardMesh.position.set(-0.2, 0.3, 0.5);
        sdGroup.add(sdCardMesh);

        sdGroup.position.set(-5.0, 0.8, 2.5);
        sdGroup.userData = { partKey: 'sdModule', defaultY: 0.8, explodeFactor: { x: -4.5, y: 3.5, z: 2.5 }, focusPos: new THREE.Vector3(-5.0, 2.5, 2.5) };
        mainGroup.add(sdGroup);
        components.push(sdGroup);

        // -------------------------------------------------------------
        // H. DHT11 傳感器
        // -------------------------------------------------------------
        const dhtGroup = new THREE.Group();
        const dhtBody = new THREE.Mesh(new THREE.BoxGeometry(2.0, 2.6, 1.1), matDhtBlue);
        dhtBody.castShadow = true;
        dhtGroup.add(dhtBody);

        dhtGroup.position.set(-0.5, 2.0, 4.2);
        dhtGroup.userData = { partKey: 'dht11', defaultY: 2.0, explodeFactor: { x: 0, y: 4, z: 4.5 }, focusPos: new THREE.Vector3(-0.5, 3.5, 4.2) };
        mainGroup.add(dhtGroup);
        components.push(dhtGroup);

        // -------------------------------------------------------------
        // I. 防水電纜接頭 (左 1 PG7，右 3 PG9)
        // -------------------------------------------------------------
        const pg7Group = new THREE.Group();
        const pg7Body = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 1.4, 16), matPowerCase);
        pg7Body.rotation.z = Math.PI / 2;
        pg7Group.add(pg7Body);
        pg7Group.position.set(-9.7, -1.4, -3.5);
        pg7Group.userData = { partKey: 'cableGland', defaultY: -1.4, explodeFactor: { x: -5, y: 0, z: -3.5 }, focusPos: new THREE.Vector3(-9.7, 0, -3.5) };
        mainGroup.add(pg7Group);
        components.push(pg7Group);

        [-3.8, 0, 3.8].forEach((zPos) => {
            const pg9Group = new THREE.Group();
            const pg9Body = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.75, 1.5, 16), matPowerCase);
            pg9Body.rotation.z = Math.PI / 2;
            pg9Group.add(pg9Body);
            pg9Group.position.set(9.7, -1.4, zPos);
            pg9Group.userData = { partKey: 'cableGland', defaultY: -1.4, explodeFactor: { x: 5, y: 0, z: zPos }, focusPos: new THREE.Vector3(9.7, 0, zPos) };
            mainGroup.add(pg9Group);
            components.push(pg9Group);
        });

        // 隱藏 Loader
        setTimeout(() => {
            document.getElementById('loader').style.opacity = 0;
            setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
        }, 600);

        // -------------------------------------------------------------
        // 4. 爆炸拆解與視角控制
        // -------------------------------------------------------------
        const explodeSlider = document.getElementById('explode-slider');
        const explodeVal = document.getElementById('explode-val');
        const opacitySlider = document.getElementById('opacity-slider');
        const opacityVal = document.getElementById('opacity-val');

        explodeSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value) / 100;
            explodeVal.innerText = `${e.target.value}%`;

            mainGroup.children.forEach(child => {
                if (child.userData && child.userData.explodeFactor) {
                    const factor = child.userData.explodeFactor;
                    const defY = child.userData.defaultY || 0;
                    child.position.y = defY + factor.y * val;
                    if (factor.x) child.position.x = (child.userData.origX || child.position.x) + factor.x * val;
                    if (factor.z) child.position.z = (child.userData.origZ || child.position.z) + factor.z * val;
                }
            });
        });

        opacitySlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value) / 100;
            opacityVal.innerText = `${e.target.value}%`;
            matCoverTransparent.opacity = val;
        });

        mainGroup.children.forEach(c => {
            if (c.userData) {
                c.userData.origX = c.position.x;
                c.userData.origZ = c.position.z;
            }
        });

        function focusComponent(key) {
            if (key === 'full') {
                animateCamera(new THREE.Vector3(22, 18, 25), new THREE.Vector3(0, 0, 0));
                return;
            }

            const targetObj = components.find(c => c.userData && c.userData.partKey === key);
            if (targetObj) {
                const info = partData[key];
                if (info) showPartInfo(info);

                const focusPos = targetObj.userData.focusPos || targetObj.position;
                const camTargetPos = new THREE.Vector3()
                    .copy(focusPos)
                    .add(new THREE.Vector3(8, 8, 10));

                animateCamera(camTargetPos, focusPos);
            }
        }

        function animateCamera(targetCamPos, targetLookAt) {
            const startCamPos = camera.position.clone();
            const startLookAt = controls.target.clone();
            let progress = 0;

            function step() {
                progress += 0.04;
                if (progress <= 1) {
                    camera.position.lerpVectors(startCamPos, targetCamPos, progress);
                    controls.target.lerpVectors(startLookAt, targetLookAt, progress);
                    controls.update();
                    requestAnimationFrame(step);
                }
            }
            step();
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const partCard = document.getElementById('part-card');

        window.addEventListener('click', (event) => {
            if (event.target.closest('.ui-header') || event.target.closest('.ui-controls') || event.target.closest('.ui-nav') || event.target.closest('.part-card')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(mainGroup.children, true);

            if (intersects.length > 0) {
                let hitObj = intersects[0].object;
                while (hitObj.parent && hitObj.parent !== mainGroup && !hitObj.userData.partKey) {
                    hitObj = hitObj.parent;
                }

                const key = hitObj.userData ? hitObj.userData.partKey : null;
                if (key && partData[key]) {
                    showPartInfo(partData[key]);
                    focusComponent(key);
                }
            }
        });

        function showPartInfo(info) {
            document.getElementById('card-title').childNodes[0].nodeValue = info.name + ' ';
            document.getElementById('card-tag').innerText = info.tag;
            document.getElementById('card-desc').innerText = info.desc;
            document.getElementById('spec-voltage').innerText = info.voltage;
            document.getElementById('spec-usage').innerText = info.usage;
            document.getElementById('spec-price').innerText = info.price;
            document.getElementById('card-link').href = info.link;
            partCard.classList.add('active');
        }

        document.getElementById('btn-reset').addEventListener('click', () => {
            focusComponent('full');
            explodeSlider.value = 0;
            explodeSlider.dispatchEvent(new Event('input'));
            partCard.classList.remove('active');
        });

        let isAnimating = false;
        document.getElementById('btn-animate').addEventListener('click', (e) => {
            isAnimating = !isAnimating;
            controls.autoRotate = isAnimating;
            controls.autoRotateSpeed = 2.0;
            e.target.style.background = isAnimating ? 'var(--primary)' : '';
            e.target.style.color = isAnimating ? '#0f172a' : '';
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
