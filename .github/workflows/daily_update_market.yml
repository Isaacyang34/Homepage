name: Daily Taiwan ETF & Stock Market Sync

on:
  schedule:
    # Runs Monday through Friday at 06:45 UTC (14:45 Taiwan Time, after market close)
    - cron: '45 6 * * 1-5'
  workflow_dispatch: # Allows manual one-click trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync_market_data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Market Data Crawler
        run: |
          python WEB_ETF_Portfolio_Analyzer/scripts/daily_market_crawler.py

      - name: Commit and Dual-Push Updated Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add WEB_ETF_Portfolio_Analyzer/etf_live_cache.json
          if git diff --staged --quiet; then
            echo "No market data changes detected today."
          else
            git commit -m "chore(market): automated daily market quotes sync [skip ci]"
            git push origin HEAD:gh-pages
            git push origin HEAD:master --force
            echo "Successfully updated and pushed daily market quotes to gh-pages and master branches!"
          fi
