name: Stock Portfolio Tracker CI

on:
  push:
    paths:
      - 'TOOL_Stock_Portfolio_Tracker/**'
      - '.github/workflows/stock_tracker_ci.yml'
  pull_request:
    paths:
      - 'TOOL_Stock_Portfolio_Tracker/**'
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Run Unit Tests & Verify Release Pipeline
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests cryptography

      - name: Execute Offline Unit Tests (Quality Gate)
        working-directory: TOOL_Stock_Portfolio_Tracker
        run: |
          python test_core_modules.py

      - name: Execute Full Release Packaging Pipeline
        working-directory: TOOL_Stock_Portfolio_Tracker
        run: |
          python package_release.py
