<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>羽球計分板 BLE 遙控器</title>
  <style>
    body { background: #121212; color: #eee; font-family: sans-serif; text-align: center; margin: 0; padding: 15px; }
    .card { background: #2a2a2a; margin-bottom: 12px; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    button {
      padding: 20px; margin: 5px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; transition: 0.1s;
      touch-action: manipulation; -webkit-user-select: none; user-select: none;
    }
    button:active { transform: scale(0.92); }
    .btn-sc { width: 45%; font-size: 2.5rem; color: white; }
    .btn-sub { width: 45%; font-size: 1.5rem; color: #ccc; padding: 15px; margin-top: 5px; }
    #connectBtn { width: 95%; background: #007bff; color: white; font-size: 1.5rem; border-radius: 15px; box-shadow: 0 0 15px rgba(0,123,255,0.4); margin-bottom: 20px; }
  </style>
</head>
<body>

  <button id="connectBtn" onclick="connectBLE()">📡 點我尋找計分板並連線</button>

  <div class="card">
    <div style="font-size:1.2rem; color:#888; margin-bottom:15px;">計分控制區</div>
    
    <div>
      <button class="btn-sc" style="background:#dc3545;" onclick="sendCmd('A')">A +1</button>
      <button class="btn-sc" style="background:#28a745;" onclick="sendCmd('B')">B +1</button>
    </div>
    
    <div>
      <button class="btn-sub" style="background:#6c1922;" onclick="sendCmd('A-')">A -1</button>
      <button class="btn-sub" style="background:#165c26;" onclick="sendCmd('B-')">B -1</button>
    </div>

    <button style="width:92%; background:#555; color:white; margin-top:25px; font-size:1.2rem;" onclick="sendCmd('R')">🔄 重設分數</button>
  </div>

  <script>
    // 藍牙 UUID 設定 (必須與 ESP32 程式碼內完全一致，且限小寫)
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const CHARACTERISTIC_UUID_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

    let bleDevice;
    let bleServer;
    let rxCharacteristic;

    async function connectBLE() {
      try {
        const btn = document.getElementById('connectBtn');
        btn.innerText = '搜尋中...';

        // 呼叫瀏覽器原生藍牙配對視窗
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'Badminton_Score_BLE' }],
          optionalServices: [SERVICE_UUID]
        });

        bleServer = await bleDevice.gatt.connect();
        const service = await bleServer.getPrimaryService(SERVICE_UUID);
        rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);

        btn.innerText = '✅ 已成功連線';
        btn.style.background = '#28a745';
        btn.style.boxShadow = '0 0 15px rgba(40,167,69,0.5)';

        // 監聽斷線事件
        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

      } catch (error) {
        console.error(error);
        document.getElementById('connectBtn').innerText = '❌ 連線失敗，請重試';
        document.getElementById('connectBtn').style.background = '#dc3545';
      }
    }

    function onDisconnected() {
      const btn = document.getElementById('connectBtn');
      btn.innerText = '⚠️ 已斷線，點我重新連線';
      btn.style.background = '#ffc107';
      btn.style.color = '#000';
      rxCharacteristic = null;
    }

    async function sendCmd(cmd) {
      if (!rxCharacteristic) {
        alert('請先點擊上方按鈕連線藍牙！');
        return;
      }
      try {
        // 將字串轉換為位元組陣列並發送
        let encoder = new TextEncoder();
        await rxCharacteristic.writeValue(encoder.encode(cmd));
        
        // 可選：發送成功時給手機一點震動反饋 (需手機支援)
        if (navigator.vibrate) navigator.vibrate(50);
      } catch (error) {
        console.error("發送失敗", error);
      }
    }
  </script>
</body>
</html>
