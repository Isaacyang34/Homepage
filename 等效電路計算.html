<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>等效電路計算</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .result {
      margin-top: 10px;
      font-size: 18px;
    }
    .box {
      padding: 10px;
      border: 1px solid #ccc;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<h2>等效電路計算</h2>

<label>頻率 f (Hz)：</label>
<input type="number" id="freq" value="50" oninput="calc()">

<br><br>

<label>X1：</label>
<input type="number" id="x1" value="0" oninput="calc()">

<br><br>

<label>X2：</label>
<input type="number" id="x2" value="0" oninput="calc()">

<div class="box">

  <div class="result">
    X1 計算結果：<span id="outX1">0</span>
  </div>

  <div class="result">
    X2 計算結果：<span id="outX2">0</span>
  </div>

  <!-- 🔥 新增 L1 / L2 -->
  <div class="result">
    L1 計算結果：<span id="outL1">0</span> H
  </div>

  <div class="result">
    L2 計算結果：<span id="outL2">0</span> H
  </div>

</div>

<script>
function calc() {
    let f = parseFloat(document.getElementById("freq").value) || 1;
    let x1 = parseFloat(document.getElementById("x1").value) || 0;
    let x2 = parseFloat(document.getElementById("x2").value) || 0;

    // 原本 X 顯示（保留）
    document.getElementById("outX1").innerText = x1.toFixed(4);
    document.getElementById("outX2").innerText = x2.toFixed(4);

    // 🔥 新增 L 計算
    let w = 2 * Math.PI * f;

    let l1 = (x1 / w);
    let l2 = (x2 / w);

    document.getElementById("outL1").innerText = l1.toFixed(6);
    document.getElementById("outL2").innerText = l2.toFixed(6);
}
</script>

</body>
</html>
