    .wire-line {
      stroke-dasharray: 8 4;
      animation: dash 30s linear infinite;
      transition: stroke 0.3s, stroke-width 0.3s, filter 0.3s;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -1000;
      }
    }
    /* 3D Label connector lines */
    .pointer-line {
      position: absolute;

    const APPLICATIONS = [

    const SPECIFICATIONS = [

    // Wiring Lines definition for hover interactive effects
    const WIRING_NETS = {

    // 3D Exploded View Canvas Component (Three.js)
    function ExplodedView3D({ explosionLevel, autoRotate, activeComponent, setActiveComponent }) {
      const containerRef = useRef(null);
      const sceneRef = useRef(null);
      const cameraRef = useRef(null);
      const rendererRef = useRef(null);
      const controlsRef = useRef(null);
      const meshesRef = useRef({});
      const animationFrameIdRef = useRef(null);
      const [errorMsg, setErrorMsg] = useState(null);

      // Initialize Three.js Scene
      useEffect(() => {
        try {
          const width = containerRef.current ? (containerRef.current.clientWidth || 600) : 600;
          const height = containerRef.current ? (containerRef.current.clientHeight || 450) : 450;

          // Scene
          const scene = new THREE.Scene();
          scene.background = new THREE.Color('#0b1622');
          sceneRef.current = scene;

          // Camera
          const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 100);
          camera.position.set(12, 8, 12);
          cameraRef.current = camera;

          // Renderer
          const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
          renderer.setSize(width, height);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          renderer.shadowMap.enabled = true;
          renderer.shadowMap.type = THREE.PCFSoftShadowMap;
          if (containerRef.current) {
            containerRef.current.appendChild(renderer.domElement);
          }
          rendererRef.current = renderer;

          // Controls
          const OrbitControlsClass = THREE.OrbitControls || window.OrbitControls;
          if (!OrbitControlsClass) {
            throw new Error("無法在 global 或 THREE 命名空間中找到 OrbitControls。請確認 CDN 指令腳本已成功加載。");
          }
          const controls = new OrbitControlsClass(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1; // Limit below ground plane
        controls.minDistance = 5;
        controls.maxDistance = 25;
        controlsRef.current = controls;

        // Lights
        const ambientLight = new THREE.AmbientLight('#ffffff', 0.6);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight('#ffffff', 0.8);
        dirLight1.position.set(5, 10, 7);
        dirLight1.castShadow = true;
        dirLight1.shadow.mapSize.width = 1024;
        dirLight1.shadow.mapSize.height = 1024;
        dirLight1.shadow.camera.near = 0.5;
        dirLight1.shadow.camera.far = 25;
        dirLight1.shadow.camera.left = -6;
        dirLight1.shadow.camera.right = 6;
        dirLight1.shadow.camera.top = 6;
        dirLight1.shadow.camera.bottom = -6;
        dirLight1.shadow.bias = -0.0005;
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight('#8da9c4', 0.4);
        dirLight2.position.set(-5, 3, -5);
        scene.add(dirLight2);

        // Point Light inside the casing for futuristic glow
        const glowLight = new THREE.PointLight('#00f0ff', 1.2, 8);
        glowLight.position.set(0, 0, 0);
        scene.add(glowLight);

        // Grid Helper
        const gridHelper = new THREE.GridHelper(20, 20, '#134074', '#0d2b4d');
        gridHelper.position.y = -5;
        scene.add(gridHelper);

        // Helper to add cast/receive shadow
        const setupShadows = (mesh) => {
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          if (mesh.children) {
            mesh.children.forEach(c => setupShadows(c));
          }
        };

        // Group to contain all monitor parts
        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        // --- Procedural 3D Modeling ---

        // 1. Materials
        const materials = {
          frostedCase: new THREE.MeshPhysicalMaterial({
            color: '#a5cbd8',
            transparent: true,
            opacity: 0.45,
            roughness: 0.15,
            metalness: 0.1,
            transmission: 0.9,
            ior: 1.5,
            side: THREE.DoubleSide
          }),
          pcbGreen: new THREE.MeshStandardMaterial({
            color: '#073B3A',
            roughness: 0.6
          }),
          pcbBlue: new THREE.MeshStandardMaterial({
            color: '#1D3557',
            roughness: 0.5
          }),
          pcbPurple: new THREE.MeshStandardMaterial({
            color: '#4A154B',
            roughness: 0.5
          }),
          silverMetal: new THREE.MeshStandardMaterial({
            color: '#B0C4DE',
            metalness: 0.9,
            roughness: 0.2
          }),
          goldMetal: new THREE.MeshStandardMaterial({
            color: '#DAA520',
            metalness: 0.8,
            roughness: 0.3
          }),
          blackPlastic: new THREE.MeshStandardMaterial({
            color: '#1C1C1C',
            roughness: 0.8
          }),
          batteryBlue: new THREE.MeshStandardMaterial({
            color: '#0080FF',
            metalness: 0.3,
            roughness: 0.3
          }),
          ledRed: new THREE.MeshBasicMaterial({ color: '#FF3B30' }),
          ledGreen: new THREE.MeshBasicMaterial({ color: '#34C759' })
        };

        // TFT Display Canvas Texture
        const screenCanvas = document.createElement('canvas');
        screenCanvas.width = 256;
        screenCanvas.height = 128;
        const ctx = screenCanvas.getContext('2d');
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, 256, 128);
        ctx.strokeStyle = '#00F0FF';
        ctx.lineWidth = 4;
        ctx.strokeRect(4, 4, 248, 120);
        // Draw texts
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px Courier New';
        ctx.fillStyle = '#00f0ff';
        ctx.fillText("AQI: 54", 25, 45);
        ctx.fillStyle = '#34c759';
        ctx.fillText("PM2.5: 22 ug/m³", 25, 75);
        ctx.fillStyle = '#ff9500';
        ctx.fillText("Temp: 24.5 °C", 25, 105);

        const screenTexture = new THREE.CanvasTexture(screenCanvas);
        materials.tftScreen = new THREE.MeshBasicMaterial({ map: screenTexture });

        // ESP32 Chip Textures (WROOM-32 shield writing)
        const espCanvas = document.createElement('canvas');
        espCanvas.width = 128;
        espCanvas.height = 128;
        const eCtx = espCanvas.getContext('2d');
        eCtx.fillStyle = '#b0c4de';
        eCtx.fillRect(0, 0, 128, 128);
        eCtx.fillStyle = '#333333';
        eCtx.font = 'bold 12px Arial';
        eCtx.textAlign = 'center';
        eCtx.fillText("ESP32", 64, 40);
        eCtx.font = '9px Arial';
        eCtx.fillText("WROOM-32", 64, 55);
        eCtx.font = '7px Arial';
        eCtx.fillText("FCC ID: 2AC7Z-ESP32", 64, 75);
        eCtx.fillText("CE RoHS", 64, 90);

        const espTexture = new THREE.CanvasTexture(espCanvas);
        materials.espShield = new THREE.MeshStandardMaterial({
          map: espTexture,
          metalness: 0.8,
          roughness: 0.3
        });

        // Part Meshes Setup
        const meshes = {};


        // A. Bottom Case (Frosted ABS)
        const bottomCase = new THREE.Group();
        const baseBox = new THREE.Mesh(new THREE.BoxGeometry(8, 0.4, 5), materials.frostedCase);
        const wallLeft = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.8, 5), materials.frostedCase);
        wallLeft.position.set(-3.85, 0.4, 0);
        const wallRight = wallLeft.clone();
        wallRight.position.x = 3.85;
        const wallFront = new THREE.Mesh(new THREE.BoxGeometry(7.4, 0.8, 0.3), materials.frostedCase);
        wallFront.position.set(0, 0.4, 2.35);
        const wallBack = wallFront.clone();
        wallBack.position.z = -2.35;
        bottomCase.add(baseBox, wallLeft, wallRight, wallFront, wallBack);
        mainGroup.add(bottomCase);
        meshes.bottom_case = { group: bottomCase, baseY: -3.5, explosionScale: -1.2 };

        // B. USB-C Charging Board (TP4056)
        const tp4056 = new THREE.Group();
        const tpPcb = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.08, 1.2), materials.pcbBlue);
        const tpUsb = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.3), materials.silverMetal);
        tpUsb.position.set(-0.6, 0.08, 0);
        const tpChips = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.4), materials.blackPlastic);
        tpChips.position.set(0.2, 0.05, 0.2);
        tp4056.add(tpPcb, tpUsb, tpChips);
        tp4056.position.set(-2, 0, 1.2); // Relative position
        mainGroup.add(tp4056);
        meshes.tp4056_board = { group: tp4056, baseY: -2.3, explosionScale: -0.6 };

        // C. Battery 18650 & Holder
        const batteryGrp = new THREE.Group();
        const holder = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.6, 1.8), materials.blackPlastic);
        const cell = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.65, 3.8, 16), materials.batteryBlue);
        cell.rotation.z = Math.PI / 2;
        cell.position.y = 0.3;
        const cellCap = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.1, 12), materials.silverMetal);
        cellCap.rotation.z = Math.PI / 2;
        cellCap.position.set(1.95, 0.3, 0);
        batteryGrp.add(holder, cell, cellCap);
        batteryGrp.position.set(0, 0, 1.2);
        mainGroup.add(batteryGrp);
        meshes.battery_18650 = { group: batteryGrp, baseY: -2.1, explosionScale: -0.4 };

        // D. ESP32 Main PCB Board
        const espPcb = new THREE.Group();
        // Board
        const board = new THREE.Mesh(new THREE.BoxGeometry(6.8, 0.08, 4.4), materials.blackPlastic);
        // ESP32 Chip
        const espChip = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.08, 2.2), materials.blackPlastic);
        espChip.position.set(0, 0.06, -0.6);
        const espShield = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.12, 1.6), materials.espShield);
        espShield.position.set(0, 0.1, -0.7);
        // Gold Pin headers on board sides
        const pinRowLeft = new THREE.Group();
        for (let i = 0; i < 15; i++) {
          const pin = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.5, 0.08), materials.goldMetal);
          pin.position.set(-1, 0, -1.8 + i * 0.26);
          pinRowLeft.add(pin);
        }
        const pinRowRight = pinRowLeft.clone();
        pinRowRight.position.x = 2.0;
        espPcb.add(board, espChip, espShield, pinRowLeft, pinRowRight);
        mainGroup.add(espPcb);
        meshes.esp32_module = { group: espPcb, baseY: -0.5, explosionScale: 0 };

        // E. PMS7003 Dust Sensor
        const pms = new THREE.Group();
        const pmsBody = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.8, 2.4), materials.silverMetal);
        // Blue sticker on top
        const pmsSticker = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.02, 2.2), materials.pcbBlue);
        pmsSticker.position.y = 0.41;
        // Intake vent hole
        const pmsIntake = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.2, 12), materials.blackPlastic);
        pmsIntake.position.set(-0.8, 0.35, -0.5);
        pms.add(pmsBody, pmsSticker, pmsIntake);
        pms.position.set(-2, 0, -0.8);
        mainGroup.add(pms);
        meshes.pms7003 = { group: pms, baseY: 0.15, explosionScale: 0.3 };

        // F. SD Card Module
        const sd = new THREE.Group();
        const sdPcb = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.06, 1.4), materials.pcbBlue);
        const sdSlot = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.1, 1.0), materials.silverMetal);
        sdSlot.position.set(0.1, 0.08, 0);
        sd.add(sdPcb, sdSlot);
        sd.position.set(2.4, 0, 1.0);
        mainGroup.add(sd);
        meshes.sd_card = { group: sd, baseY: 0.05, explosionScale: 0.4 };

        // G. BME280 Sensor
        const bme = new THREE.Group();
        const bmePcb = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.06, 0.8), materials.pcbPurple);
        const bmeMetal = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.08, 0.3), materials.silverMetal);

        bme.add(bmePcb, bmeMetal);
        bme.position.set(2.4, 0, -0.8);
        mainGroup.add(bme);
        meshes.bme280 = { group: bme, baseY: 0.05, explosionScale: 0.4 };

        // H. TFT Display
        const tft = new THREE.Group();
        const tftPcb = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.08, 2.4), materials.pcbBlue);
        const tftBezel = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.08, 1.8), materials.blackPlastic);
        tftBezel.position.y = 0.08;
        const tftScreen = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.02, 1.6), materials.tftScreen);
        tftScreen.position.y = 0.13;
        tft.add(tftPcb, tftBezel, tftScreen);
        tft.position.set(0, 0, 0.5);
        mainGroup.add(tft);
        meshes.tft_display = { group: tft, baseY: 1.8, explosionScale: 0.9 };

        // I. Top Cover (Frosted ABS)
        const topCase = new THREE.Group();
        const topBase = new THREE.Mesh(new THREE.BoxGeometry(8, 0.3, 5), materials.frostedCase);
        topBase.position.y = 0.6;
        const topWallL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.6, 5), materials.frostedCase);
        topWallL.position.set(-3.85, 0.3, 0);
        const topWallR = topWallL.clone();
        topWallR.position.x = 3.85;
        const topWallF = new THREE.Mesh(new THREE.BoxGeometry(7.4, 0.6, 0.3), materials.frostedCase);
        topWallF.position.set(0, 0.3, 2.35);
        const topWallB = topWallF.clone();
        topWallB.position.z = -2.35;
        topCase.add(topBase, topWallL, topWallR, topWallF, topWallB);
        mainGroup.add(topCase);
        meshes.top_case = { group: topCase, baseY: 3.5, explosionScale: 1.5 };

        // Save references for animation
        meshesRef.current = meshes;

        // Apply shadows helper to all added objects
        setupShadows(mainGroup);

        mainGroup.scale.set(0.9, 0.9, 0.9);

        // Raycasting for interactivity
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const onCanvasClick = (event) => {
          const rect = renderer.domElement.getBoundingClientRect();
          mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

          raycaster.setFromCamera(mouse, camera);

          // Find intersection from meshes
          let clickedKey = null;
          const intersectTargets = [];

          Object.keys(meshes).forEach((key) => {
            const group = meshes[key].group;
            group.traverse((child) => {
              if (child.isMesh) {
                child.userData.key = key; // Assign key
                intersectTargets.push(child);
              }
            });
          });

          const intersects = raycaster.intersectObjects(intersectTargets);

          if (intersects.length > 0) {
            clickedKey = intersects[0].object.userData.key;
            setActiveComponent(clickedKey);
          } else {
            setActiveComponent(null);
          }
        };

        renderer.domElement.addEventListener('click', onCanvasClick);

        // Resize Listener
        const handleResize = () => {
          if (!containerRef.current || !cameraRef.current || !rendererRef.current) return;
          const w = containerRef.current.clientWidth;
          const h = containerRef.current.clientHeight;
          cameraRef.current.aspect = w / h;
          cameraRef.current.updateProjectionMatrix();
          rendererRef.current.setSize(w, h);
        };
        window.addEventListener('resize', handleResize);

        } catch (e) {
          console.error("Three.js error:", e);
          setErrorMsg(e.message + "\n" + e.stack);
        }
        // Cleanup function
        return () => {
          window.removeEventListener('resize', handleResize);
          if (rendererRef.current && rendererRef.current.domElement) {
            rendererRef.current.domElement.removeEventListener('click', onCanvasClick);
            containerRef.current?.removeChild(rendererRef.current.domElement);
          }
          if (animationFrameIdRef.current) {
            cancelAnimationFrame(animationFrameIdRef.current);
          }
        };
      }, []);

      // Animate explosion and active highlights
      useEffect(() => {
        const meshes = meshesRef.current;
        const explosion = explosionLevel / 100;

        Object.keys(meshes).forEach((key) => {
          const item = meshes[key];
          const targetY = item.baseY + item.explosionScale * explosion * 4;
          
          // Smooth translation
          item.group.position.y = THREE.MathUtils.lerp(item.group.position.y, targetY, 0.15);

          // Component Highlighting material color pulsing (safety check for emissive property)
          item.group.traverse((child) => {
            if (child.isMesh && child.material) {
              if (child.material.emissive) {
                if (activeComponent === key) {
                  child.material.emissive.set('#00f0ff');
                  if (child.material.emissiveIntensity !== undefined) {
                    child.material.emissiveIntensity = 0.25 + Math.sin(Date.now() * 0.008) * 0.15;
                  }
                } else {
                  child.material.emissive.set('#000000');
                  if (child.material.emissiveIntensity !== undefined) {
                    child.material.emissiveIntensity = 0;
                  }
                }
              }
            }
          });
        });
      }, [explosionLevel, activeComponent]);

      // Render Loop
      useEffect(() => {
        const render = () => {
          if (controlsRef.current) {
            controlsRef.current.update();
          }

          if (autoRotate && sceneRef.current && cameraRef.current) {
            sceneRef.current.rotation.y += 0.003;
          }

          if (rendererRef.current && sceneRef.current && cameraRef.current) {
            rendererRef.current.render(sceneRef.current, cameraRef.current);
          }

          animationFrameIdRef.current = requestAnimationFrame(render);
        };
        render();
      }, [autoRotate]);

      // Reset camera view helper
      const resetView = () => {
        if (cameraRef.current && controlsRef.current) {
          cameraRef.current.position.set(12, 8, 12);
          controlsRef.current.target.set(0, 0, 0);
          if (sceneRef.current) {
            sceneRef.current.rotation.y = 0;
          }
        }
      };

              </div>
              <p className="text-xs text-brand-steel leading-relaxed">{COMPONENTS_DATA[activeComponent].desc}</p>
            </div>
          )}
        </div>
      );
    }

                  <div className="col-span-5 text-[10px] space-y-1.5 text-left font-mono">
                    <div className="flex justify-start items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-red-500"></span> <span className="text-red-400">3V3</span></div>
                    <div className="flex justify-start items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-gray-500"></span> <span className="text-gray-400">GND</span></div>
                    <div className="flex justify-start items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-blue-500"></span> <span className="text-blue-400">GPIO5 (SD CS)</span></div>
                    <div className="flex justify-start items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-blue-500"></span> <span className="text-blue-400">GPIO18 (SCK)</span></div>
                    <div className="flex justify-start items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-blue-500"></span> <span className="text-blue-400">GPIO19 (MISO)</span></div>
                    <div className="flex justify-start items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-blue-500"></span> <span className="text-blue-400">GPIO23 (MOSI)</span></div>
                  </div>

                </div>
              </div>

              {/* Pin mapping summary */}
              <div className="mt-3 p-3 bg-brand-navy/60 rounded-xl border border-brand-steel/10">
                <table className="w-full text-[10px] font-mono text-brand-steel">
                  <thead>
                    <tr className="border-b border-brand-steel/10 text-brand-ice">
                      <th className="pb-1 text-left">模組名稱</th>
                      <th className="pb-1 text-center">ESP32 引腳</th>
                      <th className="pb-1 text-right">主要信號</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr><td className="py-1">PMS7003 Sensor</td><td className="text-center">GPIO16 / 17</td><td className="text-right">UART TX / RX</td></tr>
                    <tr><td className="py-1">TFT Display</td><td className="text-center">GPIO21 / 22</td><td className="text-right">I2C SDA / SCL</td></tr>
                    <tr><td className="py-1">SD Module</td><td className="text-center">GPIO5/18/19/23</td><td className="text-right">SPI CS/SCK/MISO/MOSI</td></tr>
                    <tr><td className="py-1">BME280 Sensor</td><td className="text-center">GPIO21 / 22</td><td className="text-right">I2C (共享總線)</td></tr>
                  </tbody>
                </table>
              </div>
            </section>

            {/* WIRING DIAGRAM (Column 2) - Hover interactive SVG */}
            <section className="glass-panel p-5 rounded-2xl flex flex-col justify-between min-h-[380px]">
              <div>
                <div className="flex justify-between items-center border-b border-brand-steel/10 pb-3 mb-4">
                  <div className="flex items-center gap-2">
                    <span className="w-1 h-5 bg-brand-glow rounded-full"></span>
                    <h2 className="text-base font-bold text-brand-ice uppercase tracking-wider">WIRING DIAGRAM (接線原理圖)</h2>
                  </div>
                  {/* Signal Net selector */}
                  <div className="flex gap-1.5">
                    {Object.keys(WIRING_NETS).map(net => (
                      <button
                        key={net}
                        onMouseEnter={() => setHoveredNet(net)}
                        onMouseLeave={() => setHoveredNet(null)}
                        className={`px-1.5 py-0.5 rounded text-[8px] uppercase font-bold border transition-colors ${
                          hoveredNet === net 
                            ? 'bg-brand-glow text-brand-navy border-brand-glow' 
                            : 'bg-brand-blue/30 text-brand-steel border-brand-steel/20'
                        }`}
                      >
                        {net}
                      </button>
                    ))}
                  </div>
                </div>

                {/* SVG Circuit Drawing */}
                <div className="w-full flex justify-center bg-brand-navy/30 rounded-xl border border-brand-steel/5 p-2">
                  <svg className="w-full h-44" viewBox="0 0 500 220" fill="none">
                    
                    {/* SVG Filters for glowing active lines */}
                    <defs>
                      <filter id="glow-eff" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="2" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                      </filter>
                    </defs>

                    {/* Module Blocks */}
                    {/* PMS7003 */}
                    <rect x="15" y="30" width="70" height="50" rx="3" fill="#1C1C1C" stroke="#8DA9C4" strokeWidth="1.5"/>
                    <text x="50" y="55" fill="#EEF4F8" fontSize="9" fontWeight="bold" textAnchor="middle">PMS7003</text>
                    <text x="50" y="68" fill="#8DA9C4" fontSize="7" textAnchor="middle">Laser Sensor</text>

                    {/* TFT Display */}
                    <rect x="115" y="30" width="70" height="50" rx="3" fill="#1C1C1C" stroke="#8DA9C4" strokeWidth="1.5"/>
                    <rect x="123" y="36" width="54" height="32" rx="1" fill="#0A0A0A" stroke="#00F0FF" strokeWidth="1"/>
                    <text x="150" y="55" fill="#00F0FF" fontSize="7" fontWeight="bold" textAnchor="middle">TFT Monitor</text>

                    {/* ESP32 DEV MODULE */}
                    <rect x="215" y="25" width="80" height="100" rx="4" fill="#000000" stroke="#8DA9C4" strokeWidth="1.5"/>
                    <rect x="230" y="35" width="50" height="40" rx="2" fill="#B0C4DE" stroke="#5F7D95" strokeWidth="1"/>
                    <text x="255" y="58" fill="#1C1C1C" fontSize="10" fontWeight="bold" textAnchor="middle">ESP32</text>
                    <text x="255" y="90" fill="#8DA9C4" fontSize="8" textAnchor="middle">WROOM-32</text>

                    {/* SD CARD */}
                    <rect x="325" y="30" width="70" height="50" rx="3" fill="#1C1C1C" stroke="#8DA9C4" strokeWidth="1.5"/>
                    <text x="360" y="55" fill="#EEF4F8" fontSize="9" fontWeight="bold" textAnchor="middle">SD CARD</text>
                    <text x="360" y="68" fill="#8DA9C4" fontSize="7" textAnchor="middle">SPI Slot</text>

                    {/* 18650 Battery */}
                    <rect x="325" y="145" width="80" height="35" rx="8" fill="#005B96" stroke="#8DA9C4" strokeWidth="1.5"/>
                    <rect x="405" y="157" width="4" height="10" rx="1" fill="#B0C4DE"/>
                    <text x="365" y="166" fill="#FFFFFF" fontSize="9" fontWeight="bold" textAnchor="middle">18650 3.7V</text>

                    {/* TP4056 USB-C Charger */}
                    <rect x="215" y="150" width="70" height="40" rx="3" fill="#1C1C1C" stroke="#8DA9C4" strokeWidth="1.5"/>
                    <rect x="210" y="162" width="5" height="16" fill="#B0C4DE"/>
                    <text x="250" y="172" fill="#EEF4F8" fontSize="9" fontWeight="bold" textAnchor="middle">TP4056</text>
                    <text x="250" y="182" fill="#8DA9C4" fontSize="7" textAnchor="middle">USB-C Charge</text>

                    {/* Connection Wires / Paths */}
                    
                    {/* GND Net Wire (Grey) */}
                    <path d="M50 80v65h165m70 0h40m-50 15v10H150v-65M360 80v50m-245-50v15M150 150v20m65-10h-25" 
                      className="wire-line"
                      stroke={hoveredNet === 'gnd' ? '#00F0FF' : '#4B5563'} 
                      strokeWidth={hoveredNet === 'gnd' ? '2.5' : '1'}
                      filter={hoveredNet === 'gnd' ? 'url(#glow-eff)' : ''}
                    />

                    {/* VCC 3.3V / 5V (Red) */}
                    <path d="M35 80V20h180m0 15V10h120v20M135 80V15h210v15M275 190H420v-30" 
                      className="wire-line"
                      stroke={hoveredNet === 'vcc' ? '#FF0055' : '#EF4444'} 
                      strokeWidth={hoveredNet === 'vcc' ? '2.5' : '1'}
                      filter={hoveredNet === 'vcc' ? 'url(#glow-eff)' : ''}
                    />

                    {/* UART Net (TX/RX) Orange */}
                    <path d="M70 80V95H225M80 80V105H225" 
                      className="wire-line"
                      stroke={hoveredNet === 'uart' ? '#FFD000' : '#F59E0B'} 
                      strokeWidth={hoveredNet === 'uart' ? '2.5' : '1'}
                      filter={hoveredNet === 'uart' ? 'url(#glow-eff)' : ''}
                    />

                    {/* I2C SDA/SCL Net Green */}
                    <path d="M150 80V120H235M165 80V110H235" 
                      className="wire-line"
                      stroke={hoveredNet === 'i2c' ? '#10B981' : '#34D399'} 
                      strokeWidth={hoveredNet === 'i2c' ? '2.5' : '1'}
                      filter={hoveredNet === 'i2c' ? 'url(#glow-eff)' : ''}
                    />

                    {/* SPI Net (MOSI/MISO/SCK/CS) Blue */}
                    <path d="M335 80V95H285M345 80V105H285M360 80V115H285M375 80V125H285" 
                      className="wire-line"
                      stroke={hoveredNet === 'spi' ? '#00A8E8' : '#3B82F6'} 
                      strokeWidth={hoveredNet === 'spi' ? '2.5' : '1'}
                      filter={hoveredNet === 'spi' ? 'url(#glow-eff)' : ''}
                    />

                  </svg>
                </div>
              </div>

              <div className="mt-2 text-[10px] text-brand-steel flex justify-between">
                <span>⚡ 鼠標指針滑過訊號按鈕或線路可高亮通路。</span>
                <span>設計：TP4056 整合式充放電防護電路。</span>
              </div>
            </section>

            {/* SPECIFICATIONS PANEL (Column 3) */}
            <section className="glass-panel p-5 rounded-2xl flex flex-col justify-between min-h-[380px]">
              <div>
                <div className="flex items-center gap-2 border-b border-brand-steel/10 pb-3 mb-4">
                  <span className="w-1 h-5 bg-brand-glow rounded-full"></span>
                  <h2 className="text-base font-bold text-brand-ice uppercase tracking-wider">HARDWARE SPECIFICATIONS</h2>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-1 gap-2.5">
                  {SPECIFICATIONS.map((spec, idx) => (
                    <div key={idx} className="p-2.5 rounded-xl bg-brand-blue/15 border border-brand-steel/5 flex justify-between items-center">
                      <span className="text-xs font-bold text-brand-ice">{spec.label}</span>
                      <span className="text-xs text-brand-steel font-mono">{spec.value}</span>
                    </div>
                  ))}
                </div>
              </div>

              <div className="mt-4 p-3 bg-brand-accent/5 rounded-xl border border-brand-accent/20 text-[10px] text-brand-steel leading-relaxed">
                📢 <strong>系統擴充性：</strong> 模組引腳皆有上拉與去耦防護設計，支援未來擴充物聯網雲端連線協議（MQTT, HTTP REST）。
              </div>
            </section>

          </footer>

        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
